  <p>Schließt man das Metall an eine Batterie an, dann werden die freien Elektronen vom <b>Minuspol</b> weggedrückt und zum <b>Pluspol</b> gezogen. Sie wandern alle in eine Richtung. Das ist <b>elektrischer Strom</b>.</p></div>`},
 {t: 'custom', render: d => simMetal(d)},
 {t: 'heft', id: 'k2-heft1', text: '<b>Elektrischer Strom</b> ist fließende elektrische Ladung. In Metallen sind es die <b>freien Elektronen</b>, die sich vom Minuspol zum Pluspol bewegen.'},
 {t: 'html', html: `<div class="box fun">🐌 <b>Wie schnell sind die Elektronen?</b> Sehr langsam! Ein Elektron braucht für einen Meter Kabel etwa zehn Stunden. Trotzdem leuchtet die Lampe <b>sofort</b>, wenn du einschaltest. Warum? Das Kabel ist schon voller Elektronen. Alle fangen gleichzeitig an zu wandern – wie Wasser in einem vollen Gartenschlauch.</div>`},
 {t: 'h3', text: '2.2 Leiter und Isolatoren'},
 {t: 'html', html: `<div class="card"><p>Stoffe mit frei beweglichen Ladungen leiten den Strom: Sie heißen <b>elektrische Leiter</b>. Stoffe ohne frei bewegliche Ladungen leiten den Strom nicht: Sie heißen <b>Nichtleiter</b> oder <b>Isolatoren</b>.</p>
  <div class="grid2"><div class="card"><b>✅ Leiter</b><ul><li>alle Metalle (Kupfer, Eisen, Aluminium, Gold …)</li><li>Graphit (Bleistiftmine)</li><li>Salzwasser, Leitungswasser (schwach)</li><li>der menschliche Körper!</li></ul></div>
  <div class="card"><b>❌ Isolatoren</b><ul><li>Kunststoff (Plastik)</li><li>Glas, Keramik, Porzellan</li><li>trockenes Holz, Papier, Gummi</li><li>Luft (normalerweise), ganz reines Wasser</li></ul></div></div>
  <p>Ein Kabel braucht beides: einen Leiter innen (Kupfer) und einen Isolator außen (Kunststoff). So fließt der Strom nur im Draht – und nicht durch deine Hand.</p></div>`},
 {t: 'heft', id: 'k2-heft2', text: '<b>Leiter</b> leiten den elektrischen Strom (alle Metalle, Graphit, Salzwasser, unser Körper). <b>Isolatoren</b> (Nichtleiter) leiten den Strom nicht (Kunststoff, Glas, Keramik, trockenes Holz, Luft).'},

 {t: 'html', html: `<div class="box safety"><div class="boxtitle">⚠️ Lebensgefahr</div><ul><li>Unser Körper enthält Wasser und Salz. Er ist ein <b>Leiter</b>. Ein starker Strom durch den Körper kann schwer verletzen oder töten.</li>
  <li>Die <b>Steckdose</b> hat 230 V – das ist lebensgefährlich! Experimentiere <b>nie</b> mit der Steckdose. Fasse nie in eine Steckdose und nie an kaputte Kabel.</li>

 {t: 'html', html: `<div class="card"><p>Jeder Stromkreis braucht: eine <b>elektrische Quelle</b> (Batterie, Netzgerät, Dynamo), ein <b>elektrisches Gerät</b> (Lampe, Motor, …) und <b>Leitungen</b> (Kabel). Die beiden Anschlüsse des Geräts müssen mit den beiden <b>Polen</b> der Quelle verbunden sein: Plus und Minus.</p>
  <p>Nur wenn der Kreis <b>geschlossen</b> ist, fließt Strom. Mit einem <b>Schalter</b> kann man den Stromkreis unterbrechen (öffnen) und schließen.</p>

  <p><b>Regeln beim Zeichnen:</b> Bleistift und Lineal benutzen. Leitungen waagrecht oder senkrecht zeichnen. Kreuzungen vermeiden.</p>
  <p><b>Regeln beim Experimentieren:</b> Zuerst aufbauen, dann die Quelle einschalten (erst nach Kontrolle!). Übersichtlich aufbauen, nicht zu lange Kabel, Farben sinnvoll wählen, Kurzschlüsse vermeiden.</p></div>`},

 {t: 'h3', text: '3.3 Kurzschluss und Leuchtdiode'},
 {t: 'html', html: `<div class="card"><p><b>Kurzschluss:</b> Verbindet man die beiden Pole einer Quelle direkt mit einem Kabel – ohne Gerät dazwischen –, dann ist das ein <b>Kurzschluss</b>. Es fließt ein sehr starker Strom. Die Energie geht in Kabel und Batterie: Sie werden <b>heiß</b>. Das kann einen Brand auslösen! Auch wenn ein Kabel <b>am Gerät vorbei</b> geht, gibt es einen Kurzschluss. Probiere es oben mit dem Knopf „Kurzschluss-Kabel“.</p>
  <p><b>Leuchtdiode (LED):</b> Eine LED hat einen langen und einen kurzen Anschlussdraht. Sie leuchtet nur, wenn der <b>lange Draht am Pluspol</b> ist. Man muss also auf die richtige <b>Polung</b> achten. LEDs brauchen viel weniger Energie als Glühlampen.</p></div>`},

  <p><b>ODER-Schaltung:</b> Die Innenbeleuchtung im Auto geht an, wenn <b>irgendeine</b> Tür offen ist. Dafür liegen zwei Schalter <b>parallel</b>. Die Lampe leuchtet, wenn Schalter 1 <b>oder</b> Schalter 2 (oder beide) geschlossen sind.</p>
  <p><b>Wechselschaltung:</b> Im Flur willst du das Licht an der Tür einschalten und am Bett wieder ausschalten. Dafür braucht man zwei <b>Wechselschalter</b>. Jeder Schalter kann das Licht ein- und ausschalten – egal, wie der andere steht.</p></div>`},

  ['Du kannst beschreiben, was man an fließendem Wasser messen kann.', 'Du kennst das Wassermodell des Stromkreises.', 'Du verstehst die drei Größen <b>Spannung</b>, <b>Stromstärke</b> und <b>Widerstand</b>.', 'Du kannst das Bild „Volt – Ampere – Ohm“ erklären.']),

 {t: 'h3', text: '5.1 Was kann man an einem Fluss messen?'},
 {t: 'html', html: `<div class="card"><p>Stell dir vor, du stehst auf einer Brücke über einem Fluss. Was kannst du messen?</p>
  <ul><li><b>Wie viel Wasser</b> fließt in einer Sekunde unter der Brücke durch? Zum Beispiel: 1250 Liter pro Sekunde. Das ist der <b>Wasserstrom</b> – die „Stärke“ des Flusses.</li>
  <li><b>Wie schnell</b> fließt das Wasser? Das hängt davon ab, wie <b>steil</b> der Fluss ist (das <b>Gefälle</b>). Je steiler, desto schneller.</li>
  <li>Liegen viele <b>Steine</b> im Fluss, wird das Wasser <b>gebremst</b> – auch wenn der Fluss steil ist. Dann fließt weniger Wasser pro Sekunde.</li></ul></div>`},
 {t: 'custom', render: d => simRiver(d)},

 {t: 'h3', text: '5.2 Der Wasserstromkreis'},
 {t: 'html', html: `<div class="card"><p>In einem geschlossenen Rohr kann man Wasser im Kreis pumpen: Die <b>Pumpe</b> treibt das Wasser an. Eine <b>Engstelle</b> bremst es. Das Wasser treibt ein <b>Wasserrad</b> an. Es geht kein Wasser verloren – es fließt immer im Kreis.</p>
  <p>Genauso ist es im <b>elektrischen Stromkreis</b>: Die <b>Batterie</b> treibt die Elektronen an (wie die Pumpe). Die <b>Lampe</b> bremst den Strom (wie die Engstelle) und nimmt Energie auf (wie das Wasserrad). Es geht keine Ladung verloren.</p></div>`},
 {t: 'custom', render: d => simWaterLoop(d)},
 {t: 'html', html: `<table class="cmp"><tr><th>💧 Wasserstromkreis</th><th>⚡ Elektrischer Stromkreis</th></tr>
  <tr><td>Pumpe: treibt das Wasser an</td><td>Batterie: treibt die Elektronen an → <b>Spannung</b></td></tr>
  <tr><td>Wassermenge pro Sekunde</td><td>Ladung pro Sekunde → <b>Stromstärke</b></td></tr>
  <tr><td>Engstelle, Steine: bremsen</td><td>Lampe, Draht: hemmen → <b>Widerstand</b></td></tr>
  <tr><td>Es geht kein Wasser verloren.</td><td>Es geht keine Ladung verloren.</td></tr>
  <tr><td>Rohre sind immer voll Wasser.</td><td>Drähte sind immer voll Elektronen.</td></tr></table>`},
 {t: 'heft', id: 'k5-heft1', text: 'Im <b>Wassermodell</b> entspricht die Pumpe der Batterie, die Wassermenge pro Sekunde der Stromstärke und die Engstelle dem Widerstand. Im Wasserkreis geht kein Wasser verloren, im Stromkreis geht keine Ladung verloren.'},
 {t: 'h3', text: '5.3 Volt, Ampere und Ohm'},
 {t: 'html', html: `<div class="card"><p>Schau dir dieses Bild genau an. Drei Kerle stecken in einer Leitung:</p>
  <div class="vaopair"><figure>${vaoSVG('orig')}<figcaption>Das Original: Die Kerle heißen wie die <b>Einheiten</b>.</figcaption></figure>
  <figure>${vaoSVG('names')}<figcaption>Dasselbe Bild mit den <b>Größen</b>.</figcaption></figure></div>
  <ul><li><b class="cU">Volt</b> schiebt von hinten mit aller Kraft. Er ist die <b>Spannung</b> (U) – der <b>Antrieb</b>. Gemessen in Volt (V).</li>
  <li><b class="cI">Ampere</b> muss durch die Leitung. Er ist die <b>Stromstärke</b> (I) – wie viel Ladung pro Sekunde durchkommt. Gemessen in Ampere (A).</li>
  <li><b class="cR">Ohm</b> drückt die Leitung zusammen. Er ist der <b>Widerstand</b> (R) – er <b>hemmt</b> den Strom. Gemessen in Ohm (Ω).</li></ul>
  <p>Was passiert, wenn Volt stärker schiebt? Es kommt <b>mehr</b> Ampere durch. Und wenn Ohm stärker drückt? Dann kommt <b>weniger</b> durch. Dieses Bild begleitet dich: Tippe unten rechts auf das kleine Bild 🖼️ – du kannst es jederzeit ansehen!</p></div>`},
 {t: 'heft', id: 'k5-heft2', text: 'Die <b>Spannung U</b> ist der Antrieb des Stroms. Einheit: Volt (V).<br>Die <b>Stromstärke I</b> gibt an, wie viel Ladung pro Sekunde durch den Draht fließt. Einheit: Ampere (A).<br>Der <b>Widerstand R</b> gibt an, wie stark ein Gerät den Strom hemmt. Einheit: Ohm (Ω).<br>Mehr Spannung → mehr Strom. Mehr Widerstand → weniger Strom.'},
 heftFoto(5, 'Zeichne das Bild mit den drei Kerlen ab (einfach, mit Beschriftung) und die Tabelle Wasser ↔ Strom.'),

  ['Du kennst die Einheiten <b>Ampere</b> und <b>Volt</b> und typische Werte.', 'Du weißt: Das <b>Amperemeter</b> wird <b>in Reihe</b> eingebaut.', 'Du weißt: Das <b>Voltmeter</b> wird <b>parallel</b> angeschlossen.', 'Du weißt: Die Stromstärke ist vor und hinter einer Lampe gleich.']),
 {t: 'h2', text: '📖 Lernen', id: 'k6-L'},
 {t: 'vocab', title: 'Wörter für Kapitel 6', words: [['messen / die Messung', 'to measure / measurement'], ['das Messgerät', 'meter'], ['das Amperemeter (Strommessgerät)', 'ammeter'], ['das Voltmeter (Spannungsmessgerät)', 'voltmeter'], ['das Vielfachmessgerät', 'multimeter'], ['einbauen / anschließen', 'to insert / to connect'], ['der Messbereich', 'range'], ['das Formelzeichen', 'symbol (of a quantity)'], ['die Einheit', 'unit']]},
 {t: 'h3', text: '6.1 Die Stromstärke I'},
 {t: 'html', html: `<div class="card"><p>Die <b>Stromstärke</b> gibt an, wie viel elektrische Ladung in einer bestimmten Zeit durch den Draht fließt. Formelzeichen: <b>I</b>. Einheit: <b>Ampere (A)</b>. Kleine Ströme misst man in Milliampere: 1 A = 1000 mA.</p>
  <table class="cmp small"><tr><th>Gerät</th><th>Stromstärke</th></tr><tr><td>Armbanduhr</td><td>0,001 mA</td></tr><tr><td>Leuchtdiode</td><td>20 mA</td></tr><tr><td>Experimentier-Glühlampe</td><td>0,1 A bis 0,3 A</td></tr><tr><td>Haushaltsglühlampe (40 W)</td><td>0,26 A</td></tr><tr><td>Handy-Ladekabel</td><td>0,5 A bis 1,5 A</td></tr><tr><td>Haartrockner</td><td>8 A</td></tr><tr><td>Motor einer S-Bahn</td><td>ca. 300 A</td></tr></table>
  <p><b>Messen:</b> Alle Ladung muss <b>durch</b> das Amperemeter fließen. Darum öffnet man den Stromkreis und baut das Messgerät <b>in Reihe</b> ein. Schaltzeichen: ${sz('amp')}</p></div>`},
 {t: 'h3', text: '6.2 Die Spannung U'},
 {t: 'html', html: `<div class="card"><p>Die <b>Spannung</b> ist der <b>Antrieb</b> für die Elektronen. Ohne Spannung fließt kein Strom. Formelzeichen: <b>U</b>. Einheit: <b>Volt (V)</b> – benannt nach Alessandro Volta.</p>
  <p>Je größer die Spannung der Quelle, desto mehr Energie wird vom Strom zum Gerät übertragen. Beispiele: Mignon-Batterie 1,5 V, Flachbatterie 4,5 V, Blockbatterie 9 V, Autobatterie 12 V, Steckdose 230 V (lebensgefährlich!).</p>
  <p><b>Messen:</b> Eine Spannung misst man immer <b>zwischen zwei Stellen</b> – zum Beispiel an den beiden Polen der Batterie oder an den beiden Anschlüssen einer Lampe. Das Voltmeter wird <b>parallel</b> angeschlossen. Schaltzeichen: ${sz('volt')}</p></div>`},
 {t: 'custom', render: d => simMeasure(d)},
 {t: 'heft', id: 'k6-heft1', text: 'Die <b>Stromstärke I</b> wird in Ampere (A) gemessen. Das <b>Amperemeter</b> wird <b>in Reihe</b> in den Stromkreis eingebaut. Vor und hinter einer Lampe ist die Stromstärke gleich groß.<br>Die <b>Spannung U</b> wird in Volt (V) gemessen. Das <b>Voltmeter</b> wird <b>parallel</b> zum Bauteil angeschlossen. Eine Spannung misst man immer zwischen zwei Stellen.'},
 {t: 'html', html: `<div class="box info"><div class="boxtitle">📏 So benutzt du ein Vielfachmessgerät</div><ol><li>Betriebsart wählen: Gleichstrom „A =“ (DCA) bzw. Gleichspannung „V =“ (DCV).</li><li>Mit dem <b>größten</b> Messbereich beginnen.</li><li>Kabel vom Pluspol in die Buchse <b>A</b> bzw. <b>V</b>, Kabel zum Minuspol in die Buchse <b>COM</b>.</li><li>Wert ablesen, Einheit beachten. Bei kleinem Wert in den nächstkleineren Messbereich schalten.</li></ol></div>`},

const K7 = [
 chap(7, 'Der elektrische Widerstand und das ohmsche Gesetz', 'Toaster und Kaffeemaschine hängen an derselben Steckdose (230 V). Trotzdem fließt durch den Toaster weniger Strom. Woran liegt das? Am <b>Widerstand</b>! <span class="en">(resistance and Ohm’s law)</span>',
  ['Du weißt, was der <b>Widerstand</b> ist, und kennst die Einheit <b>Ohm</b>.', 'Du kannst mit <b>R = U : I</b> rechnen.', 'Du kennst das <b>ohmsche Gesetz</b>: I ist proportional zu U.', 'Du weißt, wovon der Widerstand eines Drahts abhängt.']),
 {t: 'h2', text: '📖 Lernen', id: 'k7-L'},
 {t: 'vocab', title: 'Wörter für Kapitel 7', words: [['der Widerstand R', 'resistance R'], ['das Ohm (Ω)', 'ohm'], ['hemmen', 'to resist, to hinder'], ['die Kennlinie', 'characteristic curve (I–U graph)'], ['proportional', 'proportional'], ['die Ursprungsgerade', 'straight line through the origin'], ['der Draht (dünn / dick)', 'wire (thin / thick)'], ['die Länge', 'length'], ['der Vorwiderstand', 'series resistor']]},
 {t: 'h3', text: '7.1 Widerstand: Spannung geteilt durch Stromstärke'},
 {t: 'html', html: `<div class="card"><p>Jedes Gerät, aber auch jeder Draht <b>hemmt</b> den elektrischen Strom. Diese Eigenschaft heißt <b>elektrischer Widerstand</b>. Formelzeichen: <b>R</b>. Einheit: <b>Ohm (Ω)</b> – benannt nach Georg Simon Ohm. (Ω ist der griechische Buchstabe Omega.)</p>
  <p>Bei gleicher Spannung gilt: Je <b>größer</b> der Widerstand, desto <b>kleiner</b> die Stromstärke. Man berechnet den Widerstand so:</p>
  <div class="center"><span class="formula">R = <span class="frac"><span>U</span><span>I</span></span></span> &nbsp;&nbsp; Einheit: 1 Ω = <span class="frac"><span>1 V</span><span>1 A</span></span></div>
  <p><b>Beispiel:</b> Der Toaster hängt an 230 V, es fließen 1,9 A. R = 230 V : 1,9 A ≈ 121 Ω. Die Kaffeemaschine: 230 V, 4 A → R = 57,5 Ω. Der Toaster hat den <b>größeren</b> Widerstand.</p></div>`},
 {t: 'heft', id: 'k7-heft1', text: 'Der <b>elektrische Widerstand R</b> gibt an, wie stark ein Gerät den Strom hemmt. Einheit: Ohm (Ω).<br><b>R = U : I</b>. &nbsp; Bei gleicher Spannung gilt: Je größer der Widerstand, desto kleiner die Stromstärke.'},
 {t: 'h3', text: '7.2 Das ohmsche Gesetz'},
 {t: 'html', html: `<div class="card"><p>Wie hängt die Stromstärke von der Spannung ab? Wir messen bei verschiedenen Spannungen und zeichnen ein Diagramm: die <b>Kennlinie</b>. Probiere es selbst im Messlabor:</p></div>`},
 {t: 'custom', render: d => simOhm(d)},
 {t: 'html', html: `<div class="card"><p>Bei den Konstantandrähten liegen die Messpunkte auf einer <b>Geraden durch den Ursprung</b>: Doppelte Spannung → doppelte Stromstärke. Man sagt: I ist <b>proportional</b> zu U. Der Widerstand bleibt gleich. Das ist das <b>ohmsche Gesetz</b>. Der dünnere Draht hat den größeren Widerstand – seine Gerade ist flacher.</p>
  <p>Bei der <b>Glühlampe</b> ist die Kennlinie gekrümmt. Der Glühdraht wird heiß, und dann wird sein Widerstand größer. Das ohmsche Gesetz gilt nur, wenn die <b>Temperatur gleich</b> bleibt.</p>
  <div class="center"><span class="formula">U = R · I</span> &nbsp; &nbsp; <span class="formula">I = <span class="frac"><span>U</span><span>R</span></span></span></div></div>`},
 {t: 'heft', id: 'k7-heft2', text: '<b>Ohmsches Gesetz:</b> Bei gleichbleibender Temperatur sind Stromstärke und Spannung proportional zueinander. Der Widerstand ist dann konstant.<br><b>U = R · I</b> &nbsp; (I = U : R, &nbsp; R = U : I)'},
 {t: 'h3', text: '7.3 Wovon hängt der Widerstand ab?'},
 {t: 'custom', render: d => simWire(d)},
 {t: 'html', html: `<div class="card"><ul><li><b>Länge:</b> Je länger der Draht, desto größer der Widerstand.</li><li><b>Dicke:</b> Je dünner der Draht, desto größer der Widerstand.</li><li><b>Material:</b> Kupfer leitet sehr gut (kleiner Widerstand), Eisen schlechter, Konstantan noch schlechter.</li></ul>
  <p>Darum sind Kabel aus <b>Kupfer</b> und nicht zu dünn. In der Technik gibt es auch extra Bauteile mit festem Widerstand: <b>Widerstände</b> (Festwiderstände mit Farbringen).</p></div>`},
 {t: 'heft', id: 'k7-heft3', text: 'Der Widerstand eines Drahts ist umso größer, je <b>länger</b> und je <b>dünner</b> der Draht ist. Er hängt auch vom <b>Material</b> ab.'},
 heftFoto(7, 'Zeichne auch eine Kennlinie (Gerade durch den Ursprung) mit Achsen „U in V“ und „I in A“.'),

 {t: 'h2', text: '✏️ Üben', id: 'k7-U'},

 {t: 'mc', id: 'k7-u5', q: 'Konstantandraht: Bei 2 V fließen 0,1 A. Wie viel fließt bei 6 V?', opts: ['0,3 A', '0,2 A', '0,6 A', '0,1 A'], a: 0, row: true, explain: 'Dreifache Spannung → dreifache Stromstärke (ohmsches Gesetz).'},

 {t: 'mc', id: 'k7-u8', q: 'Zwei Drähte, gleiche Spannung: Durch Draht A fließen 0,5 A, durch Draht B 0,1 A. Welcher hat den größeren Widerstand?', opts: ['Draht B', 'Draht A', 'beide gleich'], a: 0, row: true},
 {t: 'num', id: 'k7-u9', label: 'Knobelaufgabe ⭐', q: 'Eine Lampe (4 V, 0,1 A) soll an einem 6-V-Akku leuchten. Dafür baut man einen <b>Vorwiderstand</b> in Reihe: An ihm sollen die übrigen 2 V liegen. Wie groß muss er sein?', pre: 'R =', unit: 'Ω', a: 20, tol: .01, hint: 'R = 2 V : 0,1 A'},

/* ============================== KAPITEL 8 ============================== */
const K8 = [
 chap(8, 'Knotenregel und Maschenregel', 'Wie teilen sich Strom und Spannung in Reihen- und Parallelschaltungen auf? Zwei einfache Regeln beantworten das: die <b>Knotenregel</b> und die <b>Maschenregel</b>. Das <b>Höhenmodell</b> hilft dir dabei. <span class="en">(junction rule and loop rule)</span>',
  ['Du kennst die <b>Knotenregel</b>: Was in einen Knoten hineinfließt, fließt auch wieder heraus.', 'Du kennst die <b>Maschenregel</b>: In einer Reihenschaltung teilt sich die Spannung auf.', 'Du verstehst das <b>Höhenmodell</b> der Spannung.', 'Du kannst Widerstände in Reihe und parallel berechnen.']),
 {t: 'h2', text: '📖 Lernen', id: 'k8-L'},
 {t: 'vocab', title: 'Wörter für Kapitel 8', words: [['der Knoten (Verzweigung)', 'junction, node'], ['die Masche', 'loop (closed path)'], ['sich aufteilen', 'to split'], ['zusammenfließen', 'to flow together'], ['die Gesamtstromstärke', 'total current'], ['die Teilspannung', 'partial voltage'], ['die Summe', 'sum'], ['die Höhe', 'height'], ['bergauf / bergab', 'uphill / downhill']]},
 {t: 'h3', text: '8.1 Die Knotenregel (Parallelschaltung)'},
 {t: 'html', html: `<div class="card"><p>In einer Parallelschaltung teilt sich der Strom an einem <b>Knoten</b> (Verzweigung) auf. Am nächsten Knoten fließt er wieder zusammen. Es geht keine Ladung verloren und es kommt keine dazu – wie bei Wasser, das sich auf zwei Rohre aufteilt.</p>
  <div class="center"><span class="formula">I<sub>ges</sub> = I₁ + I₂</span></div>
  <p><b>Beispiel:</b> Vor dem Knoten fließen 250 mA. In Zweig 1 fließen 100 mA. Dann fließen in Zweig 2: 250 mA − 100 mA = <b>150 mA</b>.</p>
  <p>Und die Spannung? In der Parallelschaltung liegt an <b>jedem</b> Zweig die <b>gleiche</b> Spannung: die Spannung der Quelle. Darum funktioniert jedes Gerät an der Steckdose mit 230 V.</p></div>`},
 {t: 'heft', id: 'k8-heft1', text: '<b>Knotenregel:</b> Die Stromstärke, die in einen Knoten hineinfließt, ist genauso groß wie die Stromstärke, die herausfließt.<br><b>Parallelschaltung:</b> I<sub>ges</sub> = I₁ + I₂ + … &nbsp; und &nbsp; U<sub>ges</sub> = U₁ = U₂ = …'},
 {t: 'h3', text: '8.2 Die Maschenregel (Reihenschaltung)'},
 {t: 'html', html: `<div class="card"><p>In einer Reihenschaltung gibt es keinen Knoten. Die Stromstärke ist <b>an jeder Stelle gleich</b>. Aber die <b>Spannung teilt sich auf</b>: Liegen zwei Lampen in Reihe an 4,5 V, dann misst man zum Beispiel 3,0 V an der einen und 1,5 V an der anderen. Zusammen: 4,5 V.</p>
  <p><b>Das Höhenmodell:</b> Stell dir die Spannung wie eine <b>Höhe</b> vor. Die Batterie ist ein Aufzug: Sie hebt die Ladung um 4,5 V „nach oben“. In den Lampen geht es wieder „bergab“ – bis ganz nach unten. Wenn du einmal im Kreis herumgehst, bist du wieder auf derselben Höhe. Darum gilt: <b>So viel es mit der Batterie hinaufgeht, so viel geht es an den Geräten hinunter.</b> Egal, welchen Weg du nimmst.</p></div>`},
 {t: 'custom', render: d => simRules(d)},
 {t: 'heft', id: 'k8-heft2', text: '<b>Maschenregel:</b> Geht man einmal im Stromkreis herum, dann ist die Spannung der Quelle genauso groß wie die Summe der Spannungen an den Geräten. (Höhenmodell: hoch mit der Batterie = runter an den Geräten.)<br><b>Reihenschaltung:</b> U<sub>ges</sub> = U₁ + U₂ + … &nbsp; und &nbsp; I<sub>ges</sub> = I₁ = I₂ = …'},
 {t: 'h3', text: '8.3 Widerstände in Reihe und parallel'},
 {t: 'html', html: `<div class="card"><p><b>In Reihe:</b> Die Widerstände addieren sich. Der Strom muss durch <b>beide</b> Engstellen: <span class="formula">R<sub>ges</sub> = R₁ + R₂</span></p>
  <p><b>Parallel:</b> Der Strom hat zwei Wege. Das ist, als würde man ein zweites Rohr dazulegen: Der Gesamtwiderstand wird <b>kleiner</b> als jeder einzelne Widerstand. Für zwei <b>gleiche</b> Widerstände gilt: R<sub>ges</sub> = R : 2.</p>
  <table class="cmp"><tr><th></th><th>Reihenschaltung</th><th>Parallelschaltung</th></tr><tr><td><b>Stromstärke</b></td><td>überall gleich</td><td>teilt sich auf: I = I₁ + I₂</td></tr><tr><td><b>Spannung</b></td><td>teilt sich auf: U = U₁ + U₂</td><td>überall gleich</td></tr><tr><td><b>Widerstand</b></td><td>R = R₁ + R₂ (wird größer)</td><td>wird kleiner</td></tr></table></div>`},
 {t: 'heft', id: 'k8-heft3', text: 'Zeichne die Tabelle ab: Reihenschaltung und Parallelschaltung – Stromstärke, Spannung, Widerstand.'},
 heftFoto(8, 'Zeichne auch das Höhenmodell für zwei Lampen in Reihe.'),

 {t: 'num', id: 'k8-u2', q: 'Vor dem Knoten fließen 0,8 A. In Zweig 1 fließen 0,3 A. Wie viel fließt in Zweig 2?', pre: 'I₂ =', unit: 'A', a: .5, tol: .01},

 {t: 'num', id: 'k8-u9', label: 'Knobelaufgabe ⭐', q: 'R₁ = 20 Ω und R₂ = 40 Ω in Reihe an 12 V. Berechne zuerst die Stromstärke, dann die Spannung an R₁.', pre: 'U₁ =', unit: 'V', a: 4, tol: .01, hint: 'R<sub>ges</sub> = 60 Ω → I = 12 V : 60 Ω = 0,2 A → U₁ = 20 Ω · 0,2 A'},

 {t: 'h2', text: '🔧 Versuch', id: 'k8-V'},
 {t: 'html', html: `<div class="vstep"><div class="vn">1</div><div><b>Spannungen in der Reihenschaltung</b> (mit Messgeräten). Baue zwei Lampen in Reihe an die Batterie. Miss U<sub>ges</sub> an der Batterie, U₁ an Lampe 1 und U₂ an Lampe 2.</div></div>`},

function showPage(id, noScroll){
  $$('.page').forEach(p=>p.classList.toggle('active', p.id==='page_'+id));
  $$('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.p===id));
  try{ localStorage.setItem(APP_KEY+'_tab', id); }catch(e){}
  if(!noScroll) window.scrollTo(0,0);
}

function chapStatus(){
  $$('.cst').forEach(e=>{ const sid=e.dataset.c, pr=chapterPractice(sid), t=TESTS.find(x=>x.sess===sid);
    e.innerHTML=`⭐ ${starCount(sid)}/${totalStars(sid)} · ${t&&testDone(t)?'📝 '+t.ids.filter(i=>STATE.solved[i]).length+'/'+t.ids.length:'📝 –'}`; e.parentNode.classList.toggle('done', pr.ok && t && testDone(t)); });
}

function onLoadedForTraining(){
  if(TRAIN.erased && STATE.solved['t-1'] && !STATE.solved['t-2']){
    TRAIN.erased=false;
    setTimeout(()=>{ awardStar('t-2', $('#tStage')); toast('🎉 Super! Dein Stern ist zurück. Du bist jetzt Speicher-Profi: +1 ⭐', 4500); renderTraining(); }, 600);
  }
}
function renderTraining(){
  if(!$('#st1')) return;
  const s1=!!STATE.solved['t-1']||!!STATE.solved['t-2'], s4=!!STATE.solved['t-2'];
  const s2=TRAIN.saved||TRAIN.erased||s4, s3=TRAIN.erased||s4, s5=s4 && !DIRTY;
  const ok=[s1,s2,s3,s4,s5];
  const cur=ok.indexOf(false);
  ok.forEach((v,i)=>{ const el=$('#st'+(i+1)); el.classList.toggle('ok',v); el.classList.toggle('cur',i===cur); $('.sn',el).textContent = v?'✓':(i+1); });
  $('#tStage').innerHTML = `<span class="${STATE.solved['t-1']?'':'empty'}">⭐</span><span class="${STATE.solved['t-2']?'':'empty'}">⭐</span>`;
  $('#tCheck').checked=!!STATE.solved['t-1'];
  $('#tSaveMsg').textContent = TRAIN.saved ? '✓ Gespeichert! Weiter mit Schritt 3.' : '';
}

/* ---------------- session pages ---------------- */
function buildSession(id, blocks, nextId, nextLabel){
  const p=$('#page_'+id);
  const body=h('div'); p.appendChild(body);
  renderBlocks(body, blocks, id);
  // table of contents after the intro
  const h2s=$$('h2[id]',body);
  if(h2s.length){
    const toc=h('div',{class:'card'}); toc.innerHTML=`<b>Inhalt</b><ul class="toc">${h2s.map(x=>`<li><a href="#${x.id}">${x.textContent}</a></li>`).join('')}</ul>`;
    body.insertBefore(toc, h2s[0]);
    $$('a',toc).forEach(a=>a.onclick=e=>{ e.preventDefault(); const t=document.getElementById(a.getAttribute('href').slice(1)); window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-110, behavior:'smooth'}); });
  }
  const nav=h('div',{class:'sessionnav'});
  nav.innerHTML=`<button class="bigbtn gray" data-a="save">💾 Fortschritt speichern</button>${nextId?`<button class="bigbtn" data-a="next">${nextLabel} ➜</button>`:''}`;
  $('[data-a=save]',nav).onclick=saveDialog;
  if(nextId) $('[data-a=next]',nav).onclick=()=>showPage(nextId);
  p.appendChild(nav);
}

/* ---------------- summary ---------------- */
function renderSummary(){
  const p=$('#page_sum'); if(!p || !ORDER.length) return;
  const rows=SESSIONS.filter(s=>s.id!=='sum' && !(CLOUD_ON && s.id==='t')).map(s=>{
    const st=starCount(s.id), tot=totalStars(s.id), w=wrongCount(s.id), rv=Object.keys(STATE.revealed).filter(k=>STATE.revealed[k]&&sessOf(k)===s.id).length;
    return `<tr><td>${s.tab}</td><td class="n">⭐ ${st} / ${tot}</td><td><div class="bar"><div style="width:${tot?Math.round(100*st/tot):0}%"></div></div></td><td class="n">${w}</td><td class="n">${rv}</td></tr>`;
  }).join('');
  const hard = Object.keys(STATE.wrong).filter(k=>STATE.wrong[k]>0).sort((a,b)=>STATE.wrong[b]-STATE.wrong[a]).slice(0,6).map(k=>{
    const q=document.getElementById('q_'+k); const lab = q? ($('.qnum',q)?.textContent||'') : k; const sess=SESSIONS.find(s=>s.id===sessOf(k));
    return `<li><a href="#" data-q="${k}">${sess?sess.short:''} – ${lab}</a>: ${STATE.wrong[k]}× falsch${STATE.solved[k]?' (jetzt gelöst ✓)':''}</li>`; }).join('');
  p.innerHTML=`<h1>Mein Ergebnis</h1>
   <div class="card"><p><b>Name:</b> ${STATE.name||'<i>kein Name – bitte im Start-Tab eingeben</i>'}</p>
   <table class="sum"><thead><tr><th>Teil</th><th>Sterne</th><th></th><th>✗ falsch</th><th>Lösung angezeigt</th></tr></thead><tbody>${rows}
   <tr><th>Gesamt</th><th>⭐ ${starCount()} / ${totalStars()}</th><th></th><th>${wrongCount()}</th><th>${Object.keys(STATE.revealed).filter(k=>STATE.revealed[k]).length}</th></tr></tbody></table>
   ${STATE.tampered?'<p class="errmsg">⚠ Eine geladene Datei wurde verändert.</p>':''}
   ${STATE.foreign&&STATE.foreign.length?`<p class="errmsg">⚠ Es wurde eine Datei von einer anderen Person geladen: ${STATE.foreign.join(', ')}</p>`:''}
   <p class="small">Begonnen: ${STATE.created?new Date(STATE.created).toLocaleString('de-DE'):'-'} · Letzte Änderung: ${STATE.updated?new Date(STATE.updated).toLocaleString('de-DE'):'-'}</p></div>
   ${hard?`<div class="card"><b>Diese Aufgaben waren schwer für dich – schau sie dir noch einmal an:</b><ul>${hard}</ul></div>`:''}
   <div class="card">${CLOUD_ON?'<b>Für die Lehrkraft:</b> Dein Ergebnis ist automatisch online gespeichert. Deine Lehrkraft kann es sehen. ☁️<br><br>':'<b>Für die Lehrkraft:</b> Speichere deinen Fortschritt als Datei und gib die Datei ab, wenn deine Lehrkraft das möchte.<br><br>'}
   <button class="bigbtn" id="sumSave">💾 Speichern</button></div>`;
  $('#sumSave').onclick=saveDialog;
  const ex=h('div',{class:'card'}); ex.innerHTML=`<h3>🧩 Dein Puzzle (${puzzleCount()} von 18)</h3>${puzzleSVG(true)}
    <h3>📝 Deine Tests</h3><table class="sum"><tr><th>Kapitel</th><th>Ergebnis</th></tr>${TESTS.map(t=>`<tr><td>${SESSIONS.find(s=>s.id===t.sess).tab}</td><td>${testDone(t)?'✅ '+t.ids.filter(i=>STATE.solved[i]).length+' von '+t.ids.length+' richtig':testStarted(t)?'begonnen':'noch nicht gemacht'}</td></tr>`).join('')}</table>`;
  p.insertBefore(ex, p.children[2]||null);
  $$('a[data-q]',p).forEach(a=>a.onclick=e=>{ e.preventDefault(); const id=a.dataset.q; showPage(sessOf(id), true); const el=document.getElementById('q_'+id); if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-120}); });
}

/* ---------------- init ---------------- */
function init(){
  if(CLOUD_ON){ document.documentElement.classList.add('cloud'); const bk=readBackup(); if(bk) STATE=Object.assign(freshState(),bk); }
  buildShell();
  buildTraining();
  ALL_K.forEach((K,i)=>buildSession('k'+(i+1), K, i<8?'k'+(i+2):'sum', i<8?'Weiter zu Kapitel '+(i+2):'Zu meinem Ergebnis'));
  const bk=readBackup();
  if(!CLOUD_ON && bk && Object.keys(bk.solved).length){
    const b=$('#backupBanner'); b.classList.add('show');
    b.innerHTML=`🔎 Dieser Browser hat noch einen Fortschritt gespeichert: <b>${bk.name||'ohne Name'}</b>, ⭐ ${Object.keys(bk.solved).length}. <button class="bigbtn gray" id="bkLoad">Laden</button> <button class="vbtn" id="bkNo">Nein, danke</button>`;
    $('#bkLoad').onclick=loadFromBackup; $('#bkNo').onclick=()=>b.classList.remove('show');
  }
  refreshAllQuestions();
  updateCounters(false);
  let tab='t'; try{ const t=localStorage.getItem(APP_KEY+'_tab'); if(t && $('#page_'+t)) tab=t; }catch(e){}
  showPage(tab, true);
  window.addEventListener('beforeunload',e=>{ if(!CLOUD_ON && DIRTY && starCount()>0){ e.preventDefault(); e.returnValue=''; } });
  Cloud.init({
    app:APP_ID,
    titel:'Physik 7: Elektrizitätslehre',
    getState:()=>({name:STATE.name,solved:STATE.solved,wrong:STATE.wrong,revealed:STATE.revealed,lab:STATE.lab,tests:STATE.tests,photos:photosMeta(false),created:STATE.created,tampered:STATE.tampered||undefined,foreign:STATE.foreign||undefined}),
    photos:()=>Object.keys(STATE.photos||{}).filter(k=>STATE.photos[k].src).map(k=>({key:k, ph:STATE.photos[k]})),
    onPhotos:()=>{ backupToBrowser(); refreshPhotos(); },
    hasProgress:()=>starCount()>0||wrongCount()>0,
    setState:st=>{ const old=STATE.photos||{}; STATE = st ? Object.assign(freshState(), st, {name:STATE.name}) : freshState();
      if(st) for(const k in STATE.photos){ const o=old[k], p=STATE.photos[k]; if(o && o.src && o.t===p.t){ p.src=o.src; if(!p.fid && o.fid) p.fid=o.fid; } }
      DIRTY=false; backupToBrowser(); refreshAllQuestions(); updateCounters(false); },
    getSummary:cloudSummary,
    onLogin:info=>{ STATE.name=info.voll||info.name||info.u; backupToBrowser(); updateCounters(false); const w=$('#wName'); if(w) w.textContent=STATE.name; setTimeout(()=>Cloud.changed(),0); }
  });
}

/* ---------------- Übersicht für die Lehrkraft (Google Sheet) ---------------- */
// Eine Spalte pro Abschnitt (1.1 … 3.9): Sterne / Aufgaben, falsche Antworten
const SECTIONS=[];
ALL_K.forEach((blocks,ki)=>{
  const sid='k'+(ki+1), n=ki+1; let cur={key:sid+'-0',label:n+'.0',title:'Kapitel '+n,ids:[]};
  const push=()=>{ if(cur.ids.length) SECTIONS.push(cur); };
  blocks.forEach(b=>{
    if(b.t==='h2'){ push(); const ph=b.text.replace(/^\S+\s/,''); cur={key:b.id,label:n+' '+({Lernen:'L',Üben:'Ü',Versuch:'V',Test:'T'}[ph]||ph),title:'Kapitel '+n+': '+ph,ids:[]}; }
    else if(b.t==='test') b.items.forEach(x=>x.id&&cur.ids.push(x.id));
    else if(b.id && ['mc','num','cloze','match','heft','foto','form'].includes(b.t)) cur.ids.push(b.id);
  });
  push();
});
function cloudSummary(){
  const tasks={};
  SECTIONS.forEach(s=>{
    const sol=s.ids.filter(i=>STATE.solved[i]).length, rv=s.ids.filter(i=>STATE.revealed[i]&&!STATE.solved[i]).length;
    const err=s.ids.reduce((a,i)=>a+(STATE.wrong[i]||0),0);
    tasks[s.key]=[sol,s.ids.length,err,sol+rv,s.ids.length,s.label,s.title];
  });
  const ids=Object.keys(tasks), heft=ORDER.filter(i=>/heft/.test(i));
  const sess=n=>starCount('s'+n)+' / '+totalStars('s'+n);
  const rv=Object.keys(STATE.revealed).filter(k=>STATE.revealed[k]&&!STATE.solved[k]&&!TEST_OF[k]).length;
  const note=(STATE.tampered?'Datei wurde verändert. ':'')+((STATE.foreign&&STATE.foreign.length)?'Datei von: '+STATE.foreign.join(', '):'');
  const S_=(o=>{ o.extra=Object.assign(o.extra,o.extra2); delete o.extra2; return o; });
  return S_({stars:starCount(),max:totalStars(),err:wrongCount(),done:ids.filter(i=>tasks[i][3]>=tasks[i][4]).length,n:ids.length,tasks,
    labels:{sterne:'⭐ Sterne',max:'⭐ max.',fehler:'✗ falsch',erledigt:'Abschnitte fertig'},
    fotos:PHOTO_KEYS.slice(),
    extra:Object.assign({
      puzzle:['🧩 Puzzle',puzzleCount()+' / 18'],
      heft:['✍️ Merksätze im Heft',heft.filter(i=>STATE.solved[i]).length+' / '+heft.length],
      fotos:['📷 Fotos',PHOTO_KEYS.filter(k=>STATE.photos[k]&&STATE.photos[k].fid).length+' / '+PHOTO_KEYS.length]},
      Object.fromEntries(TESTS.map(t=>['test'+t.sess,['📝 Test '+t.sess.toUpperCase(), testDone(t) ? t.ids.filter(i=>STATE.solved[i]).length+' / '+t.ids.length : (testStarted(t)?'begonnen':'–')]]))),
    extra2:{
      rv:['👀 Lösung angezeigt',String(rv)],hinweis:['⚠ Hinweis',note]}});
}
document.addEventListener('DOMContentLoaded', init);

</script>
