<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physik 7 – Elektrizitätslehre</title>
<style>
:root{
  --ink:#1d2433; --muted:#5b6475; --bg:#f4f6fa; --card:#ffffff; --line:#dde3ec;
  --navy:#16325c; --blue:#0b7bc1; --lightblue:#e3f2fc; --merk:#0a86c9;
  --gold:#f5b301; --green:#1f9d55; --greenbg:#e7f7ee; --red:#d64545; --redbg:#fdeceb;
  --orange:#e8762b; --orangebg:#fff3ea; --violet:#6b4fbb; --violetbg:#f1edfb;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.55}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}

/* ---------- top bar ---------- */
#topbar{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#topbar .row{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:8px 14px;flex-wrap:wrap}
#topbar .title{font-weight:700;font-size:1.05rem;margin-right:auto}
#topbar .title small{display:block;font-weight:400;opacity:.75;font-size:.78rem}
.counter{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:20px;padding:4px 12px;font-weight:700;white-space:nowrap}
.counter .big{font-size:1.15rem}
#starCount.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
.tbtn{background:#fff;color:var(--navy);border:0;border-radius:8px;padding:6px 12px;font-weight:700}
.tbtn.alt{background:var(--gold);color:#3a2a00}
.tbtn:hover{filter:brightness(.95)}
#tabs{max-width:1000px;margin:0 auto;display:flex;gap:4px;padding:0 14px;overflow-x:auto}
#tabs button{background:transparent;color:#cfd9ea;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:600;white-space:nowrap}
#tabs button.active{color:#fff;border-bottom-color:var(--gold)}
#tabs button .tabstars{font-size:.8rem;opacity:.85;margin-left:4px}
#unsaved{display:none;background:#fff4d6;color:#6b4b00;text-align:center;font-size:.85rem;padding:3px 8px}
#unsaved.show{display:block}

/* ---------- layout ---------- */
main{max-width:1000px;margin:0 auto;padding:18px 14px 80px}
.page{display:none}
.page.active{display:block}
h1{color:var(--navy);font-size:1.7rem;margin:.3em 0 .2em}
h2{color:var(--navy);font-size:1.3rem;margin:1.6em 0 .5em;padding-bottom:4px;border-bottom:2px solid var(--line)}
h3{color:var(--navy);font-size:1.08rem;margin:1.2em 0 .4em}
.lead{color:var(--muted);font-size:1.02rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0;box-shadow:0 1px 3px rgba(20,30,60,.05)}
.en{color:var(--muted);font-style:italic;font-size:.92em}
.small{font-size:.88rem;color:var(--muted)}
.center{text-align:center}
.flex{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-block;background:var(--lightblue);color:var(--navy);border-radius:12px;padding:1px 9px;font-size:.85rem;font-weight:600}
mark{background:#fff2b3;padding:0 2px;border-radius:3px}
.kw{font-weight:700;color:var(--navy)}

/* info boxes */
.box{border-radius:10px;padding:12px 16px;margin:14px 0;border-left:6px solid}
.box.info{background:#eef4ff;border-color:var(--blue)}
.box.merke{background:#eef8ee;border-color:var(--green)}
.box.warn{background:#fff6e5;border-color:var(--gold)}
.box.material{background:var(--orangebg);border-color:var(--orange)}
.box.history{background:#faf6ee;border-color:#a7834a;font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.box .boxtitle{font-weight:800;margin-bottom:4px}

/* Heft sentence (book light blue) */
.heft{background:var(--lightblue);border:2px dashed var(--merk);border-radius:12px;padding:14px 16px;margin:16px 0}
.heft .htitle{font-weight:800;color:var(--merk);display:flex;gap:8px;align-items:center}
.heft .htext{color:var(--merk);font-size:1.12rem;font-weight:600;margin:6px 0 10px;line-height:1.5}
.heft label{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}
.heft input{width:22px;height:22px}
.heft.done{border-style:solid}

/* vocabulary */
.vocab{width:100%;border-collapse:collapse;margin:8px 0}
.vocab th{background:var(--navy);color:#fff;text-align:left;padding:6px 10px;font-size:.9rem}
.vocab td{padding:6px 10px;border-bottom:1px solid var(--line)}
.vocab tr:nth-child(even) td{background:#f7f9fc}
.vocab td.de{font-weight:700}
.vocab.hide-en td.enc{color:transparent;background:#e9edf3 !important;cursor:pointer;border-radius:4px}
.vocab.hide-en td.enc.peek{color:var(--ink)}
.vocabtools{display:flex;gap:8px;justify-content:flex-end}
.vbtn{background:#eef2f8;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.85rem}

/* questions */
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;margin:16px 0;position:relative;box-shadow:0 1px 3px rgba(20,30,60,.05)}
.q .qhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.q .qnum{background:var(--navy);color:#fff;border-radius:7px;padding:1px 8px;font-size:.8rem;font-weight:700}
.q .qstar{margin-left:auto;font-size:1.4rem;filter:grayscale(1);opacity:.35}
.q.solved .qstar{filter:none;opacity:1}
.q.revealed .qstar{filter:grayscale(1);opacity:.25}
.q .qtext{font-weight:600;margin-bottom:8px}
.q.solved{border-color:var(--green);background:linear-gradient(0deg,#fbfffc,#fff)}
.q.revealed{border-color:#b9c2d0}
.opts{display:flex;flex-direction:column;gap:7px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{display:flex;align-items:flex-start;gap:9px;border:2px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s}
.opt:hover{border-color:#a9bad3}
.opt input{margin-top:5px;width:18px;height:18px;flex:none}
.opt.sel{border-color:var(--blue);background:#f0f7fe}
.opt.right{border-color:var(--green);background:var(--greenbg)}
.opt.wrongsel{border-color:var(--red);background:var(--redbg)}
.opts.graphs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opts.graphs .opt{flex-direction:column;align-items:center}
.qactions{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.check{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:7px 16px;font-weight:700}
.check:disabled{background:#9aa6b8;cursor:default}
.reveal{background:#fff;border:1px solid #b9c2d0;color:var(--muted);border-radius:9px;padding:6px 12px;font-size:.88rem;display:none}
.reveal.show{display:inline-block}
.feedback{font-weight:600}
.feedback.ok{color:var(--green)}
.feedback.bad{color:var(--red)}
.explain{display:none;margin-top:10px;background:#f6f8fb;border-radius:8px;padding:9px 12px;font-size:.95rem}
.q.solved .explain,.q.revealed .explain{display:block}
.hint{display:none;margin-top:8px;background:#fff8e1;border-radius:8px;padding:7px 12px;font-size:.93rem}
.hint.show{display:block}
.wrongtag{font-size:.8rem;color:var(--red);font-weight:600}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow input{width:130px;padding:6px 9px;border:2px solid var(--line);border-radius:8px}
.numrow input.ok{border-color:var(--green);background:var(--greenbg)}
.numrow input.bad{border-color:var(--red);background:var(--redbg)}
.cloze select{padding:3px 6px;border:2px solid var(--line);border-radius:7px;background:#fff;margin:2px 0;font-weight:600}
.cloze select.ok{border-color:var(--green);background:var(--greenbg)}
.cloze select.bad{border-color:var(--red);background:var(--redbg)}
.cloze .line{margin:6px 0}
.matchrow{display:flex;align-items:center;gap:10px;margin:5px 0;flex-wrap:wrap}
.matchrow .de{min-width:180px;font-weight:700}

/* formula */
.formula{display:inline-flex;align-items:center;gap:8px;font-family:"Cambria Math","Times New Roman",serif;font-size:1.5rem;background:#fff;border:2px solid var(--navy);border-radius:10px;padding:8px 18px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
.frac>span:last-child{padding:0 4px}
.formula.small{font-size:1.1rem;padding:4px 10px;border-width:1px}

/* sims */
.sim{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:16px 0}
.sim .simtitle{font-weight:800;color:var(--violet);margin-bottom:6px}
.slider{display:grid;grid-template-columns:180px 1fr 90px;gap:10px;align-items:center;margin:4px 0}
.slider input{width:100%}
.slider output{font-weight:700;text-align:right}
canvas{max-width:100%;touch-action:none;display:block;margin:0 auto}
.simbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;justify-content:center}
.simbtns button{background:var(--violetbg);border:1px solid #cfc4ef;color:var(--violet);border-radius:8px;padding:5px 12px;font-weight:600}
.bigresult{font-size:1.4rem;font-weight:800;color:var(--navy)}

/* training */
.step{display:flex;gap:14px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.step .sn{flex:none;width:38px;height:38px;border-radius:50%;background:#d6deea;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.step.cur{border-color:var(--gold);box-shadow:0 0 0 4px #fff2c4}
.step.cur .sn{background:var(--gold);color:#3a2a00}
.step.ok{border-color:var(--green)}
.step.ok .sn{background:var(--green)}
.step .sbody{flex:1}
.step h3{margin:.1em 0 .3em}
.bigbtn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700;font-size:1rem;margin:4px 6px 4px 0}
.bigbtn.green{background:var(--green)}
.bigbtn.red{background:var(--red)}
.bigbtn.gray{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.bigbtn:disabled{opacity:.45;cursor:default}
.starstage{font-size:4rem;text-align:center;min-height:5rem;letter-spacing:8px}
.starstage .empty{filter:grayscale(1);opacity:.25}
.trainbox{display:flex;gap:10px;align-items:center;font-size:1.15rem;font-weight:700;cursor:pointer}
.trainbox input{width:28px;height:28px}
input.name{padding:8px 12px;border:2px solid var(--line);border-radius:9px;width:min(340px,100%)}
textarea.code{width:100%;min-height:80px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.75rem;border:2px solid var(--line);border-radius:8px;padding:8px;word-break:break-all}

/* modal */
#modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}
#modal.show{display:flex}
#modal .mbox{background:#fff;border-radius:14px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#modal h2{margin-top:0}
#modal .mclose{float:right;background:none;border:0;font-size:1.5rem;line-height:1;color:var(--muted)}
.method{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.method h3{margin:.1em 0 .3em}
.okmsg{color:var(--green);font-weight:700}
.errmsg{color:var(--red);font-weight:700}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;z-index:120;transition:transform .3s;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.flystar{position:fixed;font-size:2.2rem;z-index:130;pointer-events:none;transition:all .8s cubic-bezier(.5,-0.3,.6,1)}

/* banner */
#backupBanner{display:none;background:#fff4d6;border:1px solid #f0d27a;border-radius:10px;padding:10px 14px;margin:10px 0}
#backupBanner.show{display:block}

/* summary */
table.sum{width:100%;border-collapse:collapse}
table.sum th,table.sum td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
table.sum th{background:#eef2f8}
table.sum td.n{text-align:center;font-weight:700}
.bar{height:10px;background:#e7ebf2;border-radius:5px;overflow:hidden;min-width:80px}
.bar>div{height:100%;background:var(--gold)}

/* svg graphs */
svg.graph{display:block;max-width:100%;height:auto;margin:0 auto}
.graphwrap{text-align:center;margin:8px 0}
.caption{font-size:.85rem;color:var(--muted);text-align:center}
.fieldpics{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;align-items:center}
.fieldpics .arrow{font-size:2rem;color:var(--muted)}
.sessionnav{display:flex;justify-content:space-between;margin-top:30px}
.toc{columns:2;column-gap:30px;margin:6px 0}
@media (max-width:600px){.toc{columns:1}}
.toc a{color:var(--blue);text-decoration:none}
.toc a:hover{text-decoration:underline}
@media print{#topbar,#modal,#toast{display:none}.page{display:block}}

/* ---------- online speichern ---------- */
.cstat{font-size:.82rem;font-weight:700;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.12);color:#e2e8f0;white-space:nowrap}
.cstat:empty{display:none}
.cstat.ok{color:#86efac}.cstat.busy,.cstat.foto{color:#fde68a}.cstat.off{color:#fca5a5}
.cstat.big{font-size:1rem;background:var(--navy)}
.cloud #tabs button[data-p="t"] .tabstars{display:none}
.cloud .saveHint{display:none}
.fs-ov{position:fixed;inset:0;background:rgba(15,23,42,.75);display:flex;align-items:flex-start;justify-content:center;z-index:400;padding:40px 16px;overflow:auto}
.fs-box{background:#fff;border-radius:20px;padding:22px 24px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.fs-box h2{margin:.1em 0 .3em;font-size:1.6rem;border:0;color:var(--navy)}
.fs-sub{font-size:.88rem;color:var(--muted);font-weight:400}
.fs-box label{display:block;font-weight:700;margin:12px 0 4px}
.fs-box input{font-size:1.3rem;width:100%;border:2px solid #cbd5e1;border-radius:12px;padding:10px 12px}
.fs-box input:focus{outline:none;border-color:var(--blue)}
.fs-box .go{margin-top:16px;width:100%;font-size:1.2rem;padding:12px;border-radius:12px;border:0;background:var(--green);color:#fff;font-weight:800}
.fs-box .go:disabled{opacity:.5}
.fs-msg{margin-top:12px;font-weight:600;border-radius:10px;padding:8px 10px;display:none}
.fs-msg.bad{display:block;background:var(--redbg);color:#9b1c1c}
.fs-msg.info{display:block;background:#eef2ff;color:#3730a3}
details summary{cursor:pointer}
/* ---- Zusätze: Fotos, Messwerte, Versuchsschritte ---- */
.foto{background:#fff8ef;border:2px dashed var(--orange);border-radius:12px;padding:14px 16px;margin:16px 0}
.foto.done{border-style:solid;background:#f3fbf5;border-color:var(--green)}
.foto .ftitle{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.foto .ftitle .qstar{margin-left:auto;font-size:1.3rem}
.foto .fkey{font-size:.75rem;font-weight:600;background:var(--orangebg);color:var(--orange);border-radius:10px;padding:2px 8px}
.foto .ftext{margin:6px 0}
.foto .frow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.foto .fbtn{margin:0;display:inline-block}
.foto .fstat{font-size:.95rem;color:var(--muted)}
.foto.done .fstat{color:var(--green);font-weight:600}
.foto .fimg{display:none;max-width:100%;max-height:340px;border-radius:10px;margin-top:10px;border:1px solid var(--line)}
.ftips{margin:6px 0;font-size:.93rem}
.ftips summary{cursor:pointer;color:var(--blue)}
.ftips ul{margin:6px 0}
.formgrid{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.frm{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.frm .fl{min-width:170px;font-weight:600}
.frm input{width:130px;padding:8px 10px;font-size:1.1rem;border:2px solid var(--line);border-radius:8px;text-align:center}
.frm input.ok{border-color:var(--green);background:var(--greenbg)}
.frm input.bad{border-color:var(--red);background:var(--redbg)}
.vstep{display:flex;gap:14px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-left:6px solid var(--orange);border-radius:12px;padding:14px;margin:18px 0 10px}
.vstep .vn{flex:0 0 36px;height:36px;border-radius:50%;background:var(--orange);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.box.safety{background:#fff4f4;border-color:var(--red)}
.chain{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.chain .cbox{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;min-width:120px;font-weight:600}
.chain .cbox small{font-weight:400;color:var(--muted)}
.chain .cbox.el{border-color:var(--blue)} .chain .cbox.li{border-color:var(--gold)}
.chain .cic{font-size:1.6rem}
.chain .carr{display:flex;align-items:center;font-size:1.4rem;color:var(--muted)}
.flexpic{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.flexpic>div{flex:1 1 300px}
img.photo{max-width:360px;width:100%;border-radius:10px;border:1px solid var(--line)}
img.photo.wide{max-width:640px;display:block;margin:8px auto}
figure.fig{margin:8px 0;text-align:center}
figure.fig figcaption{font-size:.93rem;color:var(--ink);margin-top:4px}
svg.svgfig{width:100%;max-width:320px;height:auto}
details.pro{background:var(--violetbg);border:1px solid var(--violet);border-radius:10px;padding:8px 12px;margin:10px 0}
details.pro summary{cursor:pointer;font-weight:600;color:var(--violet)}
.sim select{font-size:1rem;padding:4px 8px;border-radius:6px}
/* ---- Klasse 7: Kapitel, Test, Puzzle, Bild ---- */
#tabs button{padding:8px 9px}
.chaphead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.chaphead .chapnum{background:var(--blue);color:#fff;font-weight:700;border-radius:20px;padding:3px 12px;font-size:.9rem}
.chaphead h1{margin:.3em 0}
h2[id$="-L"],h2[id$="-U"],h2[id$="-V"],h2[id$="-Tst"]{border-radius:10px;padding:8px 14px;margin-top:34px}
h2[id$="-L"]{background:#e8f1ff}
h2[id$="-U"]{background:#fff4dc}
h2[id$="-V"]{background:#e9f7ee}
h2[id$="-Tst"]{background:#fde8e8}
.box.fun{background:#f3efff;border-color:#8a6bd1}
.sim .simctl{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sim .simbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sim .sbtn{font-size:.95rem;padding:7px 12px;border-radius:9px;border:2px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
.sim .sbtn.prim{background:var(--blue);border-color:var(--blue);color:#fff}
.sim .sbtn.on{background:#ffe9b3;border-color:var(--gold)}
.sim .sbtn.seg.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.sim .sbtn.warnbtn{border-color:#e08a8a}
.sim .sbtn.warnbtn.on{background:#fde0e0;border-color:#c0392b}
.sim .glabel{font-weight:700;margin-right:4px}
.sim select.probe{font-size:1rem;padding:6px 8px;border-radius:8px}
svg.sz{width:76px;height:40px;vertical-align:middle}
.sztab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}
.sztab>div{display:flex;flex-direction:column;align-items:center;background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:.92rem}
table.cmp{border-collapse:collapse;width:100%;margin:8px 0;background:#fff}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
table.cmp th{background:#eef3fb}
.cU{color:#b35c00}.cI{color:#1f8a70}.cR{color:#5b3fa0}
/* Bild */
.vaosvg{width:100%;height:auto;display:block}
.vaopair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
.vaopair figure{margin:0;text-align:center}.vaopair img,.vaopair svg{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
.vaopair figcaption{font-size:.9rem;color:var(--muted)}

<body>
<noscript>Bitte öffne diese Seite in einem Browser (Safari, Chrome, Edge) mit JavaScript.</noscript>
<script>
/* =====================================================================
   Engine: state, stars, wrong answers, save / load, question widgets
   ===================================================================== */
/* ================= ☁️ Online speichern (Google Sheets + Drive) – Version 2 =================
   Gleicher Baustein für alle Übungsseiten. Die Seite liefert:
     app, titel, getState(), setState(st|null), getSummary(), onLogin(info), hasProgress()
     optional: photos() → [{key, ph}]  (ph = {src, w, h, t, fid}),  onPhotos()
   Server-Adresse: Link-Parameter ?s=<ID>  (oder STANDARD_ID unten eintragen).
   Ohne Server-ID arbeitet die Seite wie früher nur auf dem Gerät.                           */
const Cloud=(function(){
  const STANDARD_ID='';           // optional: ID aus der Web-App-URL …/macros/s/<ID>/exec
  const LOGIN_KEY='fs-login';
  const TXT={ok:'☁️ Gespeichert',busy:'⏳ Speichert …',foto:'⏳ Foto wird hochgeladen …',off:'⚠️ Offline – wird später gespeichert',lokal:'💾 Nur auf diesem Gerät'};
  const ERR={login:'Benutzername oder PIN ist falsch. Versuche es noch einmal.',
    gesperrt:'Zu viele falsche Versuche. Warte 10 Minuten oder frag deine Lehrerin / deinen Lehrer.',
    klasse:'Diese Seite ist für deine Klasse nicht freigeschaltet. Frag deine Lehrerin / deinen Lehrer.',
    netz:'Keine Verbindung zum Internet. Prüfe das WLAN und versuche es noch einmal.',
    server:'Der Server antwortet nicht richtig. Versuche es gleich noch einmal.'};
  let C=null,login=null,server='',dirty=false,timer=null,sending=null,lastSent='',lastSendAt=0,suppress=false,status='',photoRun=null,photoFail=0;
  const qs=new URLSearchParams(location.search);
  const idOk=s=>/^[A-Za-z0-9_-]{20,}$/.test(s||'');
  const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}};
  const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
  const metaKey=()=>'fs-meta-'+C.app;
  const meta=()=>lsGet(metaKey())||{};
  const pageLink=()=>location.origin+location.pathname;
  const photoList=()=>C.photos?C.photos().filter(p=>p.ph):[];
  const photosPending=()=>photoList().some(p=>p.ph.src&&!p.ph.fid);

  function setStatus(k){status=k;['cloudStatus','cloudStatus2'].forEach(id=>{const e=document.getElementById(id);if(e){e.textContent=TXT[k]||'';e.className='cstat'+(id==='cloudStatus2'?' big ':' ')+k;}});}
  function idle(){setStatus(dirty?'busy':photosPending()?(status==='off'?'off':'foto'):'ok');}
  async function call(s,body,keep){
    const txt=JSON.stringify(body);
    const r=await fetch('https://script.google.com/macros/s/'+s+'/exec',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:txt,keepalive:!!keep&&txt.length<60000,redirect:'follow'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }
  const base=()=>({u:login.u,p:login.p,app:C.app,titel:C.titel,link:pageLink()});

  /* ---- Anmelde-Fenster ---- */
  function showLogin(s,u,msg){
    let ov=document.getElementById('fsLogin');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='fsLogin';ov.className='fs-ov';
    ov.innerHTML=`<form class="fs-box" autocomplete="on"><h2>👋 Anmelden</h2>
      <div class="fs-sub">${C.titel}</div>
      <label for="fsU">Benutzername <span class="fs-sub">(user name)</span></label>
      <input id="fsU" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="z. B. 9a-07">
      <label for="fsP">PIN <span class="fs-sub">(secret number)</span></label>
      <input id="fsP" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••">
      <button class="go" type="submit">Los geht's ▶</button><div class="fs-msg" id="fsMsg"></div></form>`;
    document.body.appendChild(ov);
    const uI=ov.querySelector('#fsU'),pI=ov.querySelector('#fsP'),m=ov.querySelector('#fsMsg'),b=ov.querySelector('.go');
    const say=(cls,t)=>{m.className='fs-msg '+cls;m.textContent=t;};
    if(u)uI.value=u;if(msg)say('bad',msg);
    setTimeout(()=>(u?pI:uI).focus(),50);
    ov.querySelector('form').onsubmit=async e=>{e.preventDefault();
      const cu=uI.value.trim().toLowerCase(),cp=pI.value.trim();
      if(!cu||!cp){say('bad','Bitte Benutzername und PIN eingeben.');return;}
      b.disabled=true;say('info','⏳ Einen Moment …');
      try{const r=await call(s,{action:'login',u:cu,p:cp,app:C.app,titel:C.titel,link:pageLink()});
        if(!r.ok){say('bad',ERR[r.err]||ERR.server);b.disabled=false;pI.value='';pI.focus();return;}
        login={u:cu,p:cp,s,name:r.name||'',voll:r.voll||r.name||'',klasse:r.klasse||''};lsSet(LOGIN_KEY,login);
        ov.remove();applyServer(r.data);C.onLogin(login);
      }catch(err){say('bad',ERR.netz);b.disabled=false;}
    };
  }

  /* ---- Abgleich Gerät ↔ Server: der neuere Stand gewinnt ---- */
  function applyServer(d){
    const m=meta();
    let localT=m.t||0;
    if(m.owner&&m.owner!==login.u){suppress=true;C.setState(null);suppress=false;localT=0;}  // Stand eines anderen Kindes vom Gerät entfernen
    const serverT=(d&&d.state)?(d.t||0):-1;
    if(serverT>localT||(serverT>=0&&serverT===localT&&!hasLocal())){
      suppress=true;C.setState(d.state);suppress=false;
      lsSet(metaKey(),{owner:login.u,t:serverT});lastSent=JSON.stringify(C.getState());dirty=false;
    }else if(serverT>=0&&serverT===localT){
      lsSet(metaKey(),{owner:login.u,t:localT});lastSent=JSON.stringify(C.getState());dirty=false;   // schon gleich
    }else{
      lsSet(metaKey(),{owner:login.u,t:localT});
      if(localT>0||(!m.owner&&hasLocal())){dirty=true;send();}
    }
    idle();syncPhotos();
  }
  const hasLocal=()=>C.hasProgress?!!C.hasProgress():true;

  function changed(){
    if(suppress||!login)return;
    syncPhotos();
    const js=JSON.stringify(C.getState());if(js===lastSent)return;
    lsSet(metaKey(),{owner:login.u,t:Date.now()});dirty=true;
    if(status!=='off')setStatus('busy');schedule();
  }
  function schedule(){if(timer)return;const wait=Math.max(3000,8000-(Date.now()-lastSendAt));timer=setTimeout(()=>{timer=null;send();},wait);}
  function send(keep){
    if(!login||!dirty)return Promise.resolve(true);
    if(sending)return sending;
    const st=C.getState(),js=JSON.stringify(st);
    if(js===lastSent){dirty=false;idle();return Promise.resolve(true);}
    setStatus('busy');
    sending=call(login.s,Object.assign(base(),{action:'save',t:meta().t||Date.now(),state:st,sum:C.getSummary()}),keep)
      .then(r=>{if(r.ok){lastSent=js;dirty=JSON.stringify(C.getState())!==js;idle();return !dirty;}
        if(r.err==='login'||r.err==='klasse'||r.err==='gesperrt'){forceLogout(ERR[r.err]);return false;}
        setStatus('off');return false;})
      .catch(()=>{setStatus('off');return false;})
      .finally(()=>{sending=null;lastSendAt=Date.now();if(dirty&&login)schedule();});
    return sending;
  }

  /* ---- Fotos: hochladen (Google Drive) und auf neuem Gerät wieder holen ---- */
  function syncPhotos(){
    if(!login||!C.photos||photoRun)return photoRun||Promise.resolve();
    photoRun=(async()=>{
      for(let loop=0;loop<20;loop++){
        const up=photoList().find(p=>p.ph.src&&!p.ph.fid);
        const down=photoList().find(p=>p.ph.fid&&!p.ph.src&&!p.ph.missing);
        const job=up||down;if(!job||!login)break;
        const ph=job.ph,src=ph.src;
        if(up)setStatus('foto');
        try{
          const r=await call(login.s,Object.assign(base(),up?{action:'photo',key:job.key,data:src,sum:C.getSummary()}:{action:'photoGet',id:ph.fid}));
          if(!r.ok){
            if(r.err==='login'||r.err==='klasse'||r.err==='gesperrt'){forceLogout(ERR[r.err]);break;}
            if(down)ph.missing=true;   // Foto nicht mehr auf dem Server
            else{photoFail++;setStatus('off');break;}
          }else if(up){if(ph.src===src){ph.fid=r.id;photoFail=0;}}
          else ph.src=r.data;
          C.onPhotos&&C.onPhotos();
          if(up)changed();
        }catch(e){photoFail++;setStatus('off');break;}
      }
    })().finally(()=>{photoRun=null;if(status!=='off')idle();});
    return photoRun;
  }

  function flush(){if(dirty&&login){clearTimeout(timer);timer=null;send(true);}}
  function forceLogout(msg){const s=login.s,u=login.u;login=null;lsSet(LOGIN_KEY,null);setStatus('');showLogin(s,u,msg);}

  return {
    init(opts){C=opts;
      window.addEventListener('online',()=>{if(dirty)send();syncPhotos();});
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();});
      window.addEventListener('pagehide',flush);
      setInterval(()=>{if(dirty&&!sending)send();if(photosPending())syncPhotos();},30000);
      const sP=qs.get('s'),uP=(qs.get('u')||'').trim().toLowerCase();
      login=lsGet(LOGIN_KEY);
      const s=idOk(sP)?sP:(login&&idOk(login.s)?login.s:(idOk(STANDARD_ID)?STANDARD_ID:''));
      if(!s){login=null;setStatus('lokal');return;}
      server=s;
      if(login&&(login.s!==s||(uP&&uP!==login.u))){login=null;lsSet(LOGIN_KEY,null);}
      if(!login){showLogin(s,uP);return;}
      C.onLogin(login);setStatus('busy');
      call(s,Object.assign(base(),{action:'load'}))
        .then(r=>{if(r.ok)applyServer(r.data);else if(r.err==='login'||r.err==='klasse'||r.err==='gesperrt')forceLogout(ERR[r.err]);else setStatus('off');})
        .catch(()=>{setStatus('off');});
    },
    changed,
    paint:()=>setStatus(status),
    async now(){if(!login)return false;if(dirty||lastSent==='')dirty=true;await send();await syncPhotos();return !dirty&&!photosPending();},
    active:()=>!!login,
    configured:()=>!!server,
    user:()=>login,
    /* Abmelden. Liefert false, wenn noch nicht alles gespeichert ist (dann force=true zum Erzwingen). */
    async logout(force){
      if(!login)return true;
      if(dirty||photosPending()){await send();await syncPhotos();if((dirty||photosPending())&&!force)return false;}
      const s=login.s;login=null;lsSet(LOGIN_KEY,null);lsSet(metaKey(),null);lastSent='';dirty=false;setStatus('');
      suppress=true;C.setState(null);suppress=false;showLogin(s,'');return true;
    }
  };
})();

/* Online-Speichern aktiv? (Link mit ?s=… oder schon angemeldet) */
const CLOUD_ON=(()=>{try{const q=new URLSearchParams(location.search).get('s');if(q&&/^[A-Za-z0-9_-]{20,}$/.test(q))return true;const l=JSON.parse(localStorage.getItem('fs-login')||'null');return !!(l&&l.s);}catch(e){return false}})();
const APP_ID='physik7-elektrizitaet';
const escH=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const APP_KEY = 'gsis_elektro7_v1';
const SALT = 'GSIS-Physik7-Elektrizitaet';
const SESSIONS = [
  {id:'t',  tab:'Start', short:'Start'},
  {id:'k1', tab:'1 Atome', short:'Kapitel 1'},
  {id:'k2', tab:'2 Leiter', short:'Kapitel 2'},
  {id:'k3', tab:'3 Stromkreis', short:'Kapitel 3'},
  {id:'k4', tab:'4 Schaltungen', short:'Kapitel 4'},
  {id:'k5', tab:'5 Wassermodell', short:'Kapitel 5'},
  {id:'k6', tab:'6 Messen', short:'Kapitel 6'},
  {id:'k7', tab:'7 Widerstand', short:'Kapitel 7'},
  {id:'k8', tab:'8 Regeln', short:'Kapitel 8'},
  {id:'k9', tab:'9 Wirkungen', short:'Kapitel 9'},
  {id:'sum', tab:'Ergebnis', short:'Ergebnis'}
];

let STATE = freshState();
let DIRTY = false;
let TRAIN = {saved:false, erased:false};
const QREG = {};          // id -> {session, kind, api}
const ORDER = [];         // question ids in order

function freshState(){ return {v:1, name:'', solved:{}, wrong:{}, revealed:{}, lab:{}, photos:{}, tests:{}, created:new Date().toISOString(), updated:null}; }
function photosMeta(keepPending){ const o={}; for(const k in (STATE.photos||{})){ const p=STATE.photos[k]; o[k] = (keepPending && p.src && !p.fid) ? {src:p.src,w:p.w,h:p.h,t:p.t} : {fid:p.fid,w:p.w,h:p.h,t:p.t}; } return o; }

/* ---------- small helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
function h(tag, attrs={}, html=''){ const e=document.createElement(tag); for(const k in attrs){ if(k==='class') e.className=attrs[k]; else e.setAttribute(k,attrs[k]); } if(html) e.innerHTML=html; return e; }
function hashStr(str, seed=0){ let h1=0xdeadbeef^seed, h2=0x41c6ce57^seed; for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677);} h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return 4294967296*(2097151&h2)+(h1>>>0); }
function seeded(seed){ let s = seed>>>0 || 1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
function shuffleIdx(n, id){ const r=seeded(hashStr(id)); const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function sessOf(id){ return id.split('-')[0]; }
function fmt(x, d=2){ return (Math.round(x*10**d)/10**d).toString().replace('.',','); }

/* ---------- counters ---------- */
function starCount(sess){ return Object.keys(STATE.solved).filter(k=>STATE.solved[k] && ORDER.includes(k) && (!sess || sessOf(k)===sess)).length; }
function wrongCount(sess){ let n=0; for(const k in STATE.wrong){ if(!sess || sessOf(k)===sess) n+=STATE.wrong[k]; } return n; }
function totalStars(sess){ return ORDER.filter(id=>!sess || sessOf(id)===sess).length; }

function updateCounters(pop){ setTimeout(puzzleCheck, 0);
  $('#starCount').textContent = starCount();
  $('#starTotal').textContent = totalStars();
  $('#wrongCount').textContent = wrongCount();
  $('#nameShow').textContent = STATE.name ? STATE.name : 'kein Name';
  SESSIONS.forEach(s=>{ const b=$(`#tabs button[data-p="${s.id}"] .tabstars`); if(b && s.id!=='sum') b.textContent = `⭐${starCount(s.id)}/${totalStars(s.id)}`; });
  if(pop){ const el=$('#starCount'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  $('#unsaved').classList.toggle('show', !CLOUD_ON && DIRTY && starCount()>0);
  if(typeof renderSummary==='function') renderSummary();
  if(typeof renderTraining==='function') renderTraining();
}

function changed(pop){
  STATE.updated = new Date().toISOString();
  DIRTY = true;
  backupToBrowser();
  updateCounters(pop);
  Cloud.changed();
}

/* ---------- star / wrong bookkeeping ---------- */
function awardStar(id, fromEl){
  if(STATE.solved[id]) return;
  STATE.solved[id]=true;
  delete STATE.revealed[id];
  flyStar(fromEl);
  changed(true);
}
function addWrong(id){ STATE.wrong[id]=(STATE.wrong[id]||0)+1; changed(false); }

function flyStar(fromEl){
  try{
    const target=$('#starCount').getBoundingClientRect();
    const src = fromEl ? fromEl.getBoundingClientRect() : {left:window.innerWidth/2, top:window.innerHeight/2, width:0, height:0};
    const s=h('div',{class:'flystar'},'⭐');
    s.style.left=(src.left+src.width/2-18)+'px'; s.style.top=(src.top+src.height/2-18)+'px';
    document.body.appendChild(s);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ s.style.left=(target.left-6)+'px'; s.style.top=(target.top-8)+'px'; s.style.transform='scale(.5)'; s.style.opacity='.4'; }));
    setTimeout(()=>s.remove(),900);
  }catch(e){}
}

function toast(msg, ms=2600){ const t=$('#toast'); t.innerHTML=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), ms); }

/* =====================================================================
   SAVE / LOAD
   ===================================================================== */
function utf8ToB64(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64ToUtf8(b){ return decodeURIComponent(escape(atob(b))); }

function makeCode(){
  const json = JSON.stringify(Object.assign({}, STATE, {photos:photosMeta(false)}));
  const hsh = hashStr(json+SALT).toString(36);
  return 'EL7-' + utf8ToB64(json) + '-' + hsh;
}
function parseCode(text){
  if(!text) throw new Error('leer');
  const m = String(text).replace(/\s+/g,'').match(/EL7-([A-Za-z0-9+/=]+)-([a-z0-9]+)/);
  if(!m) throw new Error('Kein gültiger Speicher-Code gefunden.');
  const json = b64ToUtf8(m[1]);
  const st = JSON.parse(json);
  const ok = hashStr(json+SALT).toString(36) === m[2];
  if(!st || typeof st!=='object' || !st.solved) throw new Error('Datei ist beschädigt.');
  st.wrong = st.wrong||{}; st.revealed = st.revealed||{}; st.lab = st.lab||{}; st.photos = st.photos||{}; st.tests = st.tests||{};
  if(!ok) st.tampered = true;
  return st;
}
function fileName(){
  const n = (STATE.name||'Schueler').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'') || 'Schueler';
  const d = new Date(); const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return `Elektrizitaet_${n}_${ds}.txt`;
}
function fileText(){
  return `Physik Klasse 7 – Elektrizitätslehre – Spielstand\nName: ${STATE.name||'-'}\nSterne: ${starCount()} / ${totalStars()}\nFalsche Antworten: ${wrongCount()}\nGespeichert: ${new Date().toLocaleString('de-DE')}\n\nNicht verändern! Diese Datei auf der Seite mit "Laden" öffnen.\n\n${makeCode()}\n`;
}
function saveFile(){
  try{
    const blob = new Blob([fileText()], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = h('a',{href:url, download:fileName()});
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 120000);  // Safari: erst freigeben, wenn das Kind auf „Laden“ getippt hat
    markSaved('Datei');
    return true;
  }catch(e){ toast('Das Speichern als Datei hat nicht geklappt. Benutze den Code!'); return false; }
}
async function shareFile(){
  try{
    const f = new File([fileText()], fileName(), {type:'text/plain'});

/* merge: a load never deletes stars you already have */
function mergeState(st){
  if(!STATE.name && st.name) STATE.name = st.name;
  for(const k in st.solved){ if(st.solved[k]) STATE.solved[k]=true; }
  for(const k in st.wrong){ STATE.wrong[k] = Math.max(STATE.wrong[k]||0, st.wrong[k]||0); }
  for(const k in st.revealed){ if(st.revealed[k] && !STATE.solved[k]) STATE.revealed[k]=true; }
  if(st.tampered) STATE.tampered = true;
  ['lab','photos','tests'].forEach(f=>{ STATE[f]=STATE[f]||{}; for(const k in (st[f]||{})){ if(!STATE[f][k]) STATE[f][k]=st[f][k]; } });
  if(st.created && (!STATE.created || st.created < STATE.created)) STATE.created = st.created;
}
function applyLoaded(st, how){
  let foreign=false;
  if(STATE.name && st.name && STATE.name.trim().toLowerCase() !== st.name.trim().toLowerCase()){
    foreign=true; STATE.foreign = [...new Set([...(STATE.foreign||[]), st.name])];
  }
  if(st.foreign) STATE.foreign = [...new Set([...(STATE.foreign||[]), ...st.foreign])];
  const before = starCount();
  mergeState(st);
  DIRTY = false;
  refreshAllQuestions();
  backupToBrowser();
  updateCounters(true);
  Cloud.changed();
  $('#nameInput') && ($('#nameInput').value = STATE.name);
  closeModal();
  toast(`📂 Geladen (${how}): ⭐ ${starCount()} Sterne` + (st.tampered?' – ⚠ Datei wurde verändert':'') + (foreign?` – ⚠ Datei von „${st.name}“`:''), 4000);
  if(typeof onLoadedForTraining==='function') onLoadedForTraining(before);
  return true;
}
function loadFromFile(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{ try{ applyLoaded(parseCode(r.result), 'Datei'); }catch(e){ showLoadError(e.message); } };
  r.onerror = ()=> showLoadError('Die Datei konnte nicht gelesen werden.');
  r.readAsText(file);
}
function loadFromCode(text){ try{ applyLoaded(parseCode(text), 'Code'); }catch(e){ showLoadError(e.message); } }
function loadFromBackup(){ const st=readBackup(); if(!st){ showLoadError('Im Browser ist kein Fortschritt gespeichert.'); return; } applyLoaded(st,'Browser'); $('#backupBanner').classList.remove('show'); }
function showLoadError(m){ toast('❌ '+m, 4000); const e=$('.loaderr'); if(e) e.textContent='❌ '+m; }

}

let QNUM = {};
function qShell(def, sess){
  QNUM[sess]=(QNUM[sess]||0)+1;
  const el = h('div',{class:'q', id:'q_'+def.id});
  el.innerHTML = `<div class="qhead"><span class="qnum">${def.label||('Aufgabe '+QNUM[sess])}</span><span class="wrongtag"></span><span class="qstar" title="Stern">⭐</span></div>

    <div class="qactions"><button class="check">Prüfen</button><span class="feedback"></span><button class="reveal">Lösung zeigen (ohne Stern)</button></div>
    <div class="hint">💡 ${def.hint||''}</div>
    <div class="explain">${def.explain||''}</div>`;
  return el;
}
function setWrongTag(el,id){ const n=STATE.wrong[id]||0; $('.wrongtag',el).textContent = n? `✗ ${n}` : ''; }

function wireCommon(el, def, api){
  const id=def.id;
  const fb=$('.feedback',el), rv=$('.reveal',el), hint=$('.hint',el), btn=$('.check',el);
  btn.onclick = ()=>{
    if(STATE.solved[id]||STATE.revealed[id]) return;
    const res0 = api.check(); const res = (res0 && typeof res0==='object') ? res0.ok : res0; const msg = (res0 && typeof res0==='object') ? res0.msg : '';
    if(res===null){ fb.className='feedback bad'; fb.textContent='Bitte zuerst antworten.'; return; }
    if(res){ fb.className='feedback ok'; fb.textContent = praise(); awardStar(id, $('.qstar',el)); api.lock(true); el.classList.add('solved'); btn.disabled=true; rv.classList.remove('show'); if(def.once && TEST_REFRESH[TEST_OF[id]]) setTimeout(TEST_REFRESH[TEST_OF[id]], 50); }
    else{
      addWrong(id); setWrongTag(el,id);
      fb.className='feedback bad'; if(msg) fb.innerHTML = '✗ '+msg; else fb.textContent = 'Leider falsch. Versuche es noch einmal!';
      if(def.once){ STATE.revealed[id]=true; api.lock(false); el.classList.add('revealed','tfail'); btn.disabled=true; hint.classList.remove('show'); rv.classList.remove('show'); fb.textContent='✗ Leider falsch – die richtige Antwort siehst du jetzt (kein Stern).'; changed(false); if(TEST_REFRESH[TEST_OF[id]]) setTimeout(TEST_REFRESH[TEST_OF[id]], 50); }
      if(def.hint) hint.classList.add('show');
      if((STATE.wrong[id]||0)>=3) rv.classList.add('show');
    }
  };
  rv.onclick = ()=>{ if(STATE.solved[id]) return; STATE.revealed[id]=true; api.lock(false); el.classList.add('revealed'); btn.disabled=true; rv.classList.remove('show'); fb.className='feedback'; fb.textContent='Lösung angezeigt – kein Stern.'; changed(false); };
  api.refresh = ()=>{
    el.classList.remove('solved','revealed'); btn.disabled=false; fb.textContent=''; fb.className='feedback'; hint.classList.remove('show'); rv.classList.remove('show');
    api.reset && api.reset();
    if(STATE.solved[id]){ api.lock(true); el.classList.add('solved'); btn.disabled=true; fb.className='feedback ok'; fb.textContent='✓ gelöst'; }
    else if(STATE.revealed[id]){ api.lock(false); el.classList.add('revealed'); btn.disabled=true; fb.textContent= def.once ? '✗ Falsch beantwortet – hier die richtige Antwort.' : 'Lösung angezeigt – kein Stern.'; if(def.once) el.classList.add('tfail'); }
    else if((STATE.wrong[id]||0)>=3) rv.classList.add('show');
    if(!STATE.solved[id] && !STATE.revealed[id] && (STATE.wrong[id]||0)>0 && def.hint) hint.classList.add('show');
    setWrongTag(el,id);
  };
}

/* multiple choice (single or multi) */
function mcWidget(def, sess){
  const el=qShell(def, sess); const body=$('.qbody',el);
  const multi = Array.isArray(def.a);
  const correct = new Set(multi? def.a : [def.a]);
  const order = def.noShuffle ? def.opts.map((_,i)=>i) : shuffleIdx(def.opts.length, def.id);
  const box=h('div',{class:'opts'+(def.graphs?' graphs':'')+(def.row?' row':'')});
  const type = multi?'checkbox':'radio';
  order.forEach(i=>{
    const lab=h('label',{class:'opt'});
    lab.innerHTML=`<input type="${type}" name="r_${def.id}" value="${i}"><div>${def.opts[i]}</div>`;
    $('input',lab).addEventListener('change',()=>{ $$('.opt',box).forEach(o=>o.classList.toggle('sel', $('input',o).checked)); });
    box.appendChild(lab);
  });
  body.appendChild(box);
  if(multi) body.appendChild(h('div',{class:'small'},'Mehrere Antworten können richtig sein. <span class="en">(more than one may be correct)</span>'));
  const api={
    check(){ const sel=$$('input',box).filter(i=>i.checked).map(i=>+i.value); if(!sel.length) return null;
      const ok = sel.length===correct.size && sel.every(i=>correct.has(i));
      if(!ok){ $$('.opt',box).forEach(o=>{ const inp=$('input',o); o.classList.toggle('wrongsel', inp.checked); }); setTimeout(()=>$$('.opt',box).forEach(o=>o.classList.remove('wrongsel')),900); }
      return ok; },
    lock(){ $$('.opt',box).forEach(o=>{ const inp=$('input',o); const v=+inp.value; inp.disabled=true; inp.checked=correct.has(v); o.classList.toggle('right', correct.has(v)); o.classList.remove('sel','wrongsel'); }); },
    reset(){ $$('.opt',box).forEach(o=>{ const inp=$('input',o); inp.disabled=false; inp.checked=false; o.classList.remove('right','sel','wrongsel'); }); }
  };
  wireCommon(el,def,api); return {el,api};
}

/* numeric answer */
function parseNum(s){ if(s==null) return NaN; s=String(s).trim().replace(/\s/g,'').replace(/·10\^?/,'e').replace(',', '.'); const m=s.match(/-?\d*\.?\d+(e[-+]?\d+)?/i); return m? parseFloat(m[0]) : NaN; }
function numWidget(def, sess){
  const el=qShell(def, sess); const body=$('.qbody',el);
  const row=h('div',{class:'numrow'});
  row.innerHTML=`${def.pre||''}<input type="text" inputmode="decimal" placeholder="Zahl"> <b>${def.unit||''}</b>`;
  body.appendChild(row);
  const inp=$('input',row);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') $('.check',el).click(); });
  const tol = def.tol ?? 0.03;
  const api={
    check(){ const v=parseNum(inp.value); if(isNaN(v)) return null;
      const ok = def.abs!=null ? Math.abs(v-def.a)<=def.abs : Math.abs(v-def.a) <= Math.abs(def.a)*tol + 1e-12;
      inp.classList.toggle('bad',!ok); return ok; },
    lock(){ inp.value = def.show || fmt(def.a, def.dec ?? 2); inp.disabled=true; inp.classList.remove('bad'); inp.classList.add('ok'); },
    reset(){ inp.disabled=false; inp.value=''; inp.classList.remove('ok','bad'); }
  };
  wireCommon(el,def,api); return {el,api};
}

/* cloze with dropdowns:  text {*right|wrong|wrong} */
function clozeWidget(def, sess){
  const el=qShell(def, sess); const body=$('.qbody',el);
  const wrap=h('div',{class:'cloze'});
  const sels=[];
  def.lines.forEach((line,li)=>{
    const d=h('div',{class:'line'});
    let k=0;
    d.innerHTML = line.replace(/\{([^}]+)\}/g,(m,inner)=>{
      const opts=inner.split('|'); const right=opts.findIndex(o=>o.startsWith('*'));
      const clean=opts.map(o=>o.replace(/^\*/,''));
      const ord = def.noShuffle? clean.map((_,i)=>i) : shuffleIdx(clean.length, def.id+'_'+li+'_'+k);
      k++;
      return `<select data-right="${right}"><option value="">– wählen –</option>${ord.map(i=>`<option value="${i}">${clean[i]}</option>`).join('')}</select>`;
    });
    wrap.appendChild(d);
  });
  body.appendChild(wrap);
  $$('select',wrap).forEach(s=>sels.push(s));
  const api={
    check(){ if(sels.some(s=>s.value==='')) return null; let all=true;
      sels.forEach(s=>{ const ok = s.value===s.dataset.right; s.classList.toggle('bad',!ok); s.classList.toggle('ok',ok); if(!ok) all=false; });
      return all; },
    lock(){ sels.forEach(s=>{ s.value=s.dataset.right; s.disabled=true; s.classList.remove('bad'); s.classList.add('ok'); }); },
    reset(){ sels.forEach(s=>{ s.value=''; s.disabled=false; s.classList.remove('ok','bad'); }); }
  };
  wireCommon(el,def,api); return {el,api};
}

/* vocabulary matching (built on cloze) */
function matchWidget(def, sess){
  const ens = def.pairs.map(p=>p[1]);
  const lines = def.pairs.map((p,i)=>{
    const opts = ens.map((e,j)=> (j===i?'*':'')+e.replace(/[|{}]/g,'/'));

  });
  return clozeWidget({...def, lines}, sess);
}

const PHOTO_KEYS = [];          // Foto-Schlüssel in Reihenfolge (eine Spalte pro Foto im Sheet)
const PHOTO_REFRESH = [];
function compressImg(file, max = 1600, q = .72){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res({src: c.toDataURL('image/jpeg', q), w: c.width, h: c.height});
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bild')); };
    img.src = url;
  });
}

/* ---------- Puzzle: 2 Teile pro Kapitel ---------- */
const PZ_COLS = 6, PZ_ROWS = 3, PZ_W = 1000, PZ_H = 677;
let PZ_PATHS = null;
function pzPaths(){
  if(PZ_PATHS) return PZ_PATHS;
  // feste "Nasen" (pseudozufällig, aber immer gleich)
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const cw = PZ_W / PZ_COLS, ch = PZ_H / PZ_ROWS;
  const hor = [], ver = [];   // hor[r][c]: Kante unter Zeile r (r=0..R-2), ver[r][c]: Kante rechts von Spalte c
  for(let r = 0; r < PZ_ROWS - 1; r++){ hor[r] = []; for(let c = 0; c < PZ_COLS; c++) hor[r][c] = rnd() > .5 ? 1 : -1; }
  for(let r = 0; r < PZ_ROWS; r++){ ver[r] = []; for(let c = 0; c < PZ_COLS - 1; c++) ver[r][c] = rnd() > .5 ? 1 : -1; }
  // Kante von (x1,y1) nach (x2,y2) mit Nase (s = +1 / -1 / 0), Nase zeigt nach links der Laufrichtung * s
  const edge = (x1, y1, x2, y2, s) => {
    if(!s) return `L${x2},${y2}`;
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, nx = uy * s, ny = -ux * s;
    const P = (a, b) => `${(x1 + ux * a * L + nx * b * L).toFixed(1)},${(y1 + uy * a * L + ny * b * L).toFixed(1)}`;
    return `L${P(.36, 0)} C${P(.40, .02)} ${P(.32, .20)} ${P(.50, .21)} C${P(.68, .20)} ${P(.60, .02)} ${P(.64, 0)} L${x2},${y2}`;
  };
  PZ_PATHS = [];
  for(let r = 0; r < PZ_ROWS; r++) for(let c = 0; c < PZ_COLS; c++){
    const x0 = c * cw, y0 = r * ch, x1 = x0 + cw, y1 = y0 + ch;
    let d = `M${x0},${y0}`;
    d += edge(x0, y0, x1, y0, r > 0 ? hor[r - 1][c] : 0);           // oben (nach rechts)
    d += edge(x1, y0, x1, y1, c < PZ_COLS - 1 ? -ver[r][c] : 0);       // rechts (nach unten)
    d += edge(x1, y1, x0, y1, r < PZ_ROWS - 1 ? -hor[r][c] : 0);       // unten (nach links)
    d += edge(x0, y1, x0, y0, c > 0 ? ver[r][c - 1] : 0);              // links (nach oben)
    PZ_PATHS.push({d: d + 'Z', cx: x0 + cw / 2, cy: y0 + ch / 2});
  }
  return PZ_PATHS;
}
/* welche Teile sind verdient?  Teil 2k-1: Kapitel k zu 80 % geübt;  Teil 2k: Test von Kapitel k gemacht */
function chapterPractice(sid){
  const ids = ORDER.filter(i => sessOf(i) === sid && !TEST_OF[i]);
  const got = ids.filter(i => STATE.solved[i]).length;
  return {got, n: ids.length, ok: ids.length > 0 && got >= Math.ceil(.8 * ids.length)};
}
function piecesEarned(){
  const out = [];
  CHAPTERS.forEach((sid, k) => {
    out.push({k, sid, kind: 'L', ok: chapterPractice(sid).ok});
    const t = TESTS.find(x => x.sess === sid); out.push({k, sid, kind: 'T', ok: !!(t && testDone(t))});
  });
  return out;
}
// Teil-Reihenfolge auf dem Bild (gemischt, damit sich das Bild überall langsam füllt)
const PZ_ORDER = [7, 4, 10, 1, 13, 16, 8, 3, 15, 0, 11, 6, 14, 2, 9, 17, 5, 12];
function puzzleSVG(big){
  const P = pzPaths(), E = piecesEarned();

    <rect x="-8" y="-8" width="1016" height="693" rx="14" fill="#eef1f6"/>`;
  E.forEach((e, j) => {

    if(e.ok) s += `<g class="pzp ${big && j === PZ_NEW ? 'pznew' : ''}"><image href="${IMG_BLANK}" width="1000" height="677" clip-path="url(#pz${i}${big ? 'b' : ''})"/>

}

/* =====================================================================
   SVG helpers: graphs and field-line pictures
   ===================================================================== */
function graph(o){
  const W=o.w||380, H=o.h||230, ml=o.ml||48, mb=40, mt=14, mr=16;
  const [x0,x1,dx]=o.x, [y0,y1,dy]=o.y;
  const X=v=>ml+(v-x0)/(x1-x0)*(W-ml-mr), Y=v=>H-mb-(v-y0)/(y1-y0)*(H-mb-mt);
  let s=`<svg class="graph" viewBox="0 0 ${W} ${H}" width="${W}" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif" font-size="12">`;
  if(o.bands) o.bands.forEach(b=>{ s+=`<rect x="${X(b[0])}" y="${mt}" width="${X(b[1])-X(b[0])}" height="${H-mb-mt}" fill="${b[2]||'#fff2b3'}" opacity=".7"/>`; if(b[3]) s+=`<text x="${(X(b[0])+X(b[1]))/2}" y="${mt+12}" text-anchor="middle" font-weight="700" fill="#6b4b00">${b[3]}</text>`; });
  for(let v=x0; v<=x1+1e-9; v+=dx){ s+=`<line x1="${X(v)}" y1="${mt}" x2="${X(v)}" y2="${H-mb}" stroke="#e3e8f0"/>`; if(o.noXnum!==true) s+=`<text x="${X(v)}" y="${H-mb+15}" text-anchor="middle" fill="#555">${fmt(v,2)}</text>`; }
  for(let v=y0; v<=y1+1e-9; v+=dy){ s+=`<line x1="${ml}" y1="${Y(v)}" x2="${W-mr}" y2="${Y(v)}" stroke="#e3e8f0"/>`; if(o.noYnum!==true) s+=`<text x="${ml-6}" y="${Y(v)+4}" text-anchor="end" fill="#555">${fmt(v,2)}</text>`; }
  const ya = (y0<=0 && y1>=0)? Y(0) : H-mb;
  s+=`<line x1="${ml}" y1="${ya}" x2="${W-mr+4}" y2="${ya}" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>`;
  s+=`<line x1="${ml}" y1="${H-mb}" x2="${ml}" y2="${mt-6}" stroke="#333" stroke-width="1.5"/>`;
  s+=`<text x="${W-mr}" y="${H-6}" text-anchor="end" fill="#333" font-style="italic">${o.xl||''}</text>`;
  s+=`<text x="${ml+6}" y="${mt+2}" fill="#333" font-style="italic">${o.yl||''}</text>`;
  const series = o.series || [{pts:o.pts, fn:o.fn, color:o.color}];
  series.forEach(se=>{
    let pts = se.pts;
    if(se.fn){ pts=[]; const n=200; for(let i=0;i<=n;i++){ const t=x0+(x1-x0)*i/n; pts.push([t,se.fn(t)]); } }
    s+=`<polyline fill="none" stroke="${se.color||'#0b7bc1'}" stroke-width="${se.width||3}" stroke-linejoin="round" ${se.dash?'stroke-dasharray="6 4"':''} points="${pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`;
    if(se.dots) se.pts.forEach(p=>{ s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="${se.color||'#0b7bc1'}"/>`; });
  });
  if(o.labels) o.labels.forEach(l=>{ s+=`<text x="${X(l[0])}" y="${Y(l[1])}" text-anchor="middle" font-weight="700" fill="${l[3]||'#16325c'}">${l[2]}</text>`; });
  s+=`<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs></svg>`;
  return o.caption ? `<div class="graphwrap">${s}<div class="caption">${o.caption}</div></div>` : `<div class="graphwrap">${s}</div>`;
}

/* field picture: cols x rows grid. field(c,r)->bool ; coil [c0,r0,c1,r1] (inclusive cells) */
function fieldPic(o){
  const cs=o.cell||22, cols=o.cols, rows=o.rows, W=cols*cs+(o.meter?40:4), H=rows*cs+4;
  const inCoil=(c,r)=> o.coil && c>=o.coil[0] && c<=o.coil[2] && r>=o.coil[1] && r<=o.coil[3];
  let s=`<svg class="graph" viewBox="0 0 ${W} ${H}" width="${W}" xmlns="http://www.w3.org/2000/svg">`;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const f=(o.region||o.field)(c,r);
    if(f) s+=`<rect x="${c*cs+2}" y="${r*cs+2}" width="${cs}" height="${cs}" fill="#bfe3f8"/>`;
  }
  if(o.coil){ const [c0,r0,c1,r1]=o.coil; s+=`<rect x="${c0*cs+2}" y="${r0*cs+2}" width="${(c1-c0+1)*cs}" height="${(r1-r0+1)*cs}" fill="#0b7bc1" opacity=".85"/>`; }
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if(!o.field(c,r)) continue;
    const cx=c*cs+2+cs/2, cy=r*cs+2+cs/2, rr=cs*0.27, col=inCoil(c,r)?'#fff':'#1b5f8c';
    s+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="${col}" stroke-width="1.4"/>`;
    if(o.sym==='dot') s+=`<circle cx="${cx}" cy="${cy}" r="${rr*0.35}" fill="${col}"/>`;
    else s+=`<path d="M${cx-rr*.7},${cy-rr*.7}L${cx+rr*.7},${cy+rr*.7}M${cx+rr*.7},${cy-rr*.7}L${cx-rr*.7},${cy+rr*.7}" stroke="${col}" stroke-width="1.4"/>`;
  }
  if(o.coil){ const [c0,r0,c1,r1]=o.coil; const x=c1*cs+cs+2, ym=(r0+r1+1)/2*cs+2;
    s+=`<rect x="${c0*cs+2}" y="${r0*cs+2}" width="${(c1-c0+1)*cs}" height="${(r1-r0+1)*cs}" fill="none" stroke="#a0392b" stroke-width="3"/>`;
    if(o.meter){ const mx=Math.max(x+20, cols*cs+20); s+=`<path d="M${x},${r0*cs+2+4} H${mx} V${ym-10} M${mx},${ym+10} V${(r1+1)*cs-2} H${x}" fill="none" stroke="#a0392b" stroke-width="2"/><circle cx="${mx}" cy="${ym}" r="10" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="${mx}" y="${ym+4}" text-anchor="middle" font-size="11" font-family="Arial">V</text>`; }
  }
  s+='</svg>';
  return `<div>${s}${o.label?`<div class="caption">${o.label}</div>`:''}</div>`;
}
function rectField(c0,r0,c1,r1, step=1){ return (c,r)=> c>=c0&&c<=c1&&r>=r0&&r<=r1 && ((c-c0)%step===0) && ((r-r0)%step===0); }

const MU0 = 1.26e-6;

/* ---------- Session 1: B = mu0 N I / L ---------- */
function simCoilB(root){
  root.className='sim';
  root.innerHTML=`<div class="simtitle">🧪 Simulation: Magnetfeld in einer langen Spule</div>
  <div class="small">Verändere die Stromstärke I, die Windungszahl N und die Länge L. Beobachte B.</div>
  <div class="slider"><label>Stromstärke I</label><input type="range" min="0" max="3" step="0.1" value="1" data-k="I"><output></output></div>
  <div class="slider"><label>Windungen N</label><input type="range" min="100" max="1000" step="100" value="300" data-k="N"><output></output></div>
  <div class="slider"><label>Länge L</label><input type="range" min="0.1" max="0.5" step="0.05" value="0.15" data-k="L"><output></output></div>
  <div class="center" style="margin:10px 0"><span class="formula small">B = <span class="frac"><span>μ₀ · N · I</span><span>L</span></span> = <span class="frac"><span class="calcTop"></span><span class="calcBot"></span></span></span>
   <div class="bigresult" style="margin-top:6px">B = <span class="bval"></span> mT</div></div>
  <div class="plot"></div>
  <div class="caption">Blaue Gerade: B gegen I für deine Spule. Der Punkt ist deine Einstellung. <span class="en">(B is proportional to I → straight line through the origin)</span></div>`;
  const inp={}; $$('input',root).forEach(i=>inp[i.dataset.k]=i);
  function upd(){
    const I=+inp.I.value, N=+inp.N.value, L=+inp.L.value;
    $$('.slider',root).forEach(s=>{ const i=$('input',s), o=$('output',s); o.textContent = i.dataset.k==='I'? fmt(I,1)+' A' : i.dataset.k==='N'? N : fmt(L,2)+' m'; });
    const B = MU0*N*I/L*1000;
    $('.calcTop',root).textContent = `1,26·10⁻⁶ T·m/A · ${N} · ${fmt(I,1)} A`;
    $('.calcBot',root).textContent = `${fmt(L,2)} m`;
    $('.bval',root).textContent = fmt(B,2);
    const slope = MU0*N/L*1000;
    const line = slope*3>15 ? [[0,0],[15/slope,15]] : [[0,0],[3,3*slope]];
    $('.plot',root).innerHTML = graph({x:[0,3,0.5], y:[0,15,3], xl:'I in A', yl:'B in mT', w:420, h:240,
      series:[{pts:line, color:'#0b7bc1'}, {pts:[[I,B]], dots:true, color:'#e8762b', width:0}]});
  }
  Object.values(inp).forEach(i=>i.addEventListener('input',upd)); upd();
}

/* ---------- canvas helper ---------- */
function setupCanvas(cv, W, H){
  const dpr = window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width='100%'; cv.style.maxWidth=W+'px'; cv.style.aspectRatio=W+'/'+H;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); return ctx;
}
function drawMeter(ctx, x, y, r, val, label){
  ctx.save();
  ctx.fillStyle='#3a3f4a'; roundRect(ctx, x-r-14, y-r-14, 2*r+28, r+56, 10); ctx.fill();
  ctx.fillStyle='#fdfdf8'; roundRect(ctx, x-r-6, y-r-6, 2*r+12, r+42, 6); ctx.fill();
  ctx.strokeStyle='#333'; ctx.lineWidth=1.2;
  for(let i=-10;i<=10;i++){ const a=-Math.PI/2 + i*Math.PI/30; const r1=r-(i%5===0?12:6);
    ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*r1, y+12+Math.sin(a)*r1); ctx.lineTo(x+Math.cos(a)*r, y+12+Math.sin(a)*r); ctx.stroke(); }
  ctx.fillStyle='#333'; ctx.font='bold 13px Arial'; ctx.textAlign='center';
  ctx.fillText('0', x, y-r+30); ctx.fillText('−', x-r+6, y+2); ctx.fillText('+', x+r-6, y+2);
  ctx.font='11px Arial'; ctx.fillText(label||'U', x, y+31);
  const v=Math.max(-1.05, Math.min(1.05, val)); const a=-Math.PI/2 + v*Math.PI/3;
  ctx.strokeStyle='#c0392b'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(x, y+12); ctx.lineTo(x+Math.cos(a)*(r-4), y+12+Math.sin(a)*(r-4)); ctx.stroke();
  ctx.fillStyle='#333'; ctx.beginPath(); ctx.arc(x,y+12,4,0,7); ctx.fill();
  ctx.restore();
}
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawStrip(ctx, x, y, w, h, data, key, color, label, scale){
  ctx.save();
  ctx.fillStyle='#fff'; ctx.fillRect(x,y,w,h); ctx.strokeStyle='#dde3ec'; ctx.strokeRect(x,y,w,h);
  ctx.strokeStyle='#999'; ctx.beginPath(); ctx.moveTo(x, y+h/2); ctx.lineTo(x+w, y+h/2); ctx.stroke();
  ctx.fillStyle='#555'; ctx.font='12px Arial'; ctx.textAlign='left'; ctx.fillText(label, x+6, y+14);
  ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.beginPath();
  data.forEach((d,i)=>{ const px=x+w*i/(data.length-1), py=y+h/2 - Math.max(-1,Math.min(1,d[key]/scale))*(h/2-6); i?ctx.lineTo(px,py):ctx.moveTo(px,py); });
  ctx.stroke(); ctx.restore();
}

/* ---------- Session 3: magnet and coil ---------- */
function simMagnet(root){
  root.className='sim';
  root.innerHTML=`<div class="simtitle">🧪 Simulation: Magnet und Spule</div>
   <div class="small">Ziehe den Magneten mit der Maus oder dem Finger. Oder benutze den Schieberegler. <span class="en">(drag the magnet)</span></div>
   <canvas></canvas>
   <div class="slider"><label>Position Magnet</label><input type="range" min="0" max="1000" value="80" class="pos"><output></output></div>
   <div class="simbtns">
     <button data-a="flip">🔄 Magnet umdrehen (N ↔ S)</button>
     <button data-a="turns">Windungen: <b class="tn">500</b></button>
     <button data-a="slow">▶ langsam durch die Spule</button>
     <button data-a="fast">⏩ schnell durch die Spule</button>
     <button data-a="stop">⏹ Stopp</button>
   </div>`;
  const W=760, H=430, cv=$('canvas',root), ctx=setupCanvas(cv,W,H);
  const coilX=W/2, coilY=120, coilW=120, coilH=110, magL=170, magH=36;
  let pos=0.08, pol=1, turns=500, auto=null, dragging=false, dragOff=0;
  const posToX=p=> 60+magL/2 + p*(W-120-magL), xToPos=x=> Math.max(0,Math.min(1,(x-60-magL/2)/(W-120-magL)));
  const flux=x=>{ const d=(x-coilX)/75; return pol*turns/500 * 1/Math.pow(1+d*d,1.5); };
  let lastFlux=flux(posToX(pos)), U=0, hist=[]; for(let i=0;i<300;i++) hist.push({u:0,f:lastFlux});
  const slider=$('.pos',root);
  slider.addEventListener('input',()=>{ auto=null; pos=slider.value/1000; });
  const ptr=e=>{ const r=cv.getBoundingClientRect(); return (e.clientX-r.left)*W/r.width; };
  const ptrY=e=>{ const r=cv.getBoundingClientRect(); return (e.clientY-r.top)*H/r.height; };
  cv.addEventListener('pointerdown',e=>{ const x=ptr(e), y=ptrY(e), mx=posToX(pos); if(Math.abs(x-mx)<magL/2+10 && Math.abs(y-coilY)<magH){ dragging=true; dragOff=x-mx; auto=null; cv.setPointerCapture(e.pointerId); } });
  cv.addEventListener('pointermove',e=>{ if(dragging){ pos=xToPos(ptr(e)-dragOff); } });
  const up=()=>dragging=false; cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  $$('.simbtns button',root).forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='flip'){ pol*=-1; lastFlux=flux(posToX(pos)); }
    if(a==='turns'){ turns = turns===250?500: turns===500?1000:250; $('.tn',root).textContent=turns; lastFlux=flux(posToX(pos)); }
    if(a==='slow'||a==='fast'){ auto={v:(a==='slow'?0.18:0.55), dir: pos<0.5?1:-1}; }
    if(a==='stop') auto=null;
  });
  let tPrev=performance.now();
  function frame(t){
    if(!root.isConnected) return;
    const dt=Math.min(0.05,(t-tPrev)/1000); tPrev=t;
    if(auto){ pos+=auto.v*auto.dir*dt; if(pos>=1||pos<=0){ pos=Math.max(0,Math.min(1,pos)); auto=null; } }
    slider.value=Math.round(pos*1000); $('output',root).textContent='';
    const f=flux(posToX(pos)); const dU = dt>0? -(f-lastFlux)/dt : 0; lastFlux=f;
    U += (dU*0.45 - U)*Math.min(1, dt*14);
    hist.push({u:U, f}); if(hist.length>300) hist.shift();
    draw(f);
    requestAnimationFrame(frame);
  }
  function draw(f){
    ctx.clearRect(0,0,W,H);
    // coil body
    const cx=coilX-coilW/2, cy=coilY-coilH/2;
    ctx.fillStyle='#c98d5a'; roundRect(ctx,cx,cy,coilW,coilH,6); ctx.fill();
    ctx.strokeStyle='#7a4a24'; ctx.lineWidth=2; for(let i=0;i<=coilW;i+=7){ ctx.beginPath(); ctx.moveTo(cx+i,cy+2); ctx.lineTo(cx+i,cy+coilH-2); ctx.stroke(); }
    ctx.fillStyle='#fff'; ctx.fillRect(cx-4, coilY-magH/2-4, coilW+8, magH+8);
    // wires to meter
    ctx.strokeStyle='#c0392b'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(cx+18,cy); ctx.bezierCurveTo(cx+10,cy-30,W-170,cy-10,W-120,70); ctx.moveTo(cx+coilW-18,cy); ctx.bezierCurveTo(cx+coilW,cy-40,W-150,cy-25,W-100,72); ctx.stroke();
    drawMeter(ctx, W-110, 40, 46, U*1.6, 'Spannung U');
    // magnet
    const mx=posToX(pos), x0=mx-magL/2;
    const left = pol>0 ? ['N','#d9433b'] : ['S','#2f9e5a'], right = pol>0 ? ['S','#2f9e5a'] : ['N','#d9433b'];
    ctx.fillStyle=left[1]; ctx.fillRect(x0, coilY-magH/2, magL/2, magH);
    ctx.fillStyle=right[1]; ctx.fillRect(mx, coilY-magH/2, magL/2, magH);
    ctx.strokeStyle='#333'; ctx.lineWidth=1.5; ctx.strokeRect(x0, coilY-magH/2, magL, magH);
    ctx.fillStyle='#fff'; ctx.font='bold 18px Arial'; ctx.textAlign='center';
    ctx.fillText(left[0], x0+16, coilY+6); ctx.fillText(right[0], x0+magL-16, coilY+6);
    // coil front part over magnet
    ctx.fillStyle='rgba(201,141,90,.55)'; ctx.fillRect(cx, coilY-magH/2-4, coilW, magH+8);
    ctx.strokeStyle='rgba(122,74,36,.8)'; for(let i=0;i<=coilW;i+=7){ ctx.beginPath(); ctx.moveTo(cx+i,coilY-magH/2-4); ctx.lineTo(cx+i,coilY+magH/2+4); ctx.stroke(); }
    ctx.fillStyle='#333'; ctx.font='13px Arial'; ctx.fillText('Spule ('+turns+' Windungen)', coilX, cy+coilH+18);
    // flux bar
    ctx.fillStyle='#555'; ctx.textAlign='left'; ctx.font='12px Arial'; ctx.fillText('Feldlinien in der Spule:', 20, 30);
    ctx.fillStyle='#e3e8f0'; ctx.fillRect(20,38,200,14); ctx.fillStyle=f>=0?'#0b7bc1':'#8e44ad'; ctx.fillRect(120,38, Math.max(-100,Math.min(100,f*50)),14);
    // strips
    drawStrip(ctx, 20, 220, W-40, 95, hist, 'f', '#0b7bc1', 'Magnetfeld in der Spule (Anzahl Feldlinien)', 1.3);
    drawStrip(ctx, 20, 325, W-40, 95, hist, 'u', '#c0392b', 'induzierte Spannung U', 1.2);
    ctx.fillStyle='#777'; ctx.font='11px Arial'; ctx.textAlign='right'; ctx.fillText('Zeit →', W-26, 416);
  }
  requestAnimationFrame(frame);
}

/* ---------- Session 3: rotating coil ---------- */
function simRotate(root){
  root.className='sim';
  root.innerHTML=`<div class="simtitle">🧪 Simulation: Eine Spule dreht sich im Magnetfeld</div>
   <div class="small">Seitenansicht: Die Feldlinien gehen von oben nach unten. Die Spule (eine Windung) dreht sich. Zähle die Feldlinien, die durch die Spule gehen (orange).</div>
   <canvas></canvas>
   <div class="slider"><label>Drehgeschwindigkeit</label><input type="range" min="0" max="2" step="0.1" value="0.5"><output></output></div>
   <div class="simbtns"><button data-a="pause">⏸ Pause / ▶ Weiter</button></div>`;
  const W=760, H=400, cv=$('canvas',root), ctx=setupCanvas(cv,W,H);
  let th=0, run=true, hist=[]; const sp=$('input',root);
  $('button',root).onclick=()=>run=!run;
  const lines=[]; for(let x=60;x<=300;x+=24) lines.push(x);
  const cx=180, cy=150, half=110;
  let tPrev=performance.now();
  function frame(t){
    if(!root.isConnected) return;
    const dt=Math.min(0.05,(t-tPrev)/1000); tPrev=t;
    const w=+sp.value; $('output',root).textContent = w==0?'steht':fmt(w,1)+' U/s';
    if(run) th += w*2*Math.PI*dt;
    const phi = Math.cos(th); const u = w*Math.sin(th);
    if(run && w>0){ hist.push({f:phi,u}); if(hist.length>260) hist.shift(); }
    draw(phi,u); requestAnimationFrame(frame);
  }
  function draw(phi,u){
    ctx.clearRect(0,0,W,H);
    const x1=cx-Math.cos(th)*half, y1=cy-Math.sin(th)*half, x2=cx+Math.cos(th)*half, y2=cy+Math.sin(th)*half;
    const lo=Math.min(x1,x2), hi=Math.max(x1,x2);
    let n=0;
    lines.forEach(x=>{ const hit = x>lo && x<hi; if(hit) n++;
      ctx.strokeStyle= hit?'#e8762b':'#8cc7ec'; ctx.lineWidth=hit?3:2; ctx.beginPath(); ctx.moveTo(x,20); ctx.lineTo(x,285); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x-5,276); ctx.lineTo(x,286); ctx.lineTo(x+5,276); ctx.stroke(); });
    // coil (edge-on), two coloured faces
    const nx=-Math.sin(th), ny=Math.cos(th);
    ctx.lineCap='round';
    ctx.strokeStyle='#a0392b'; ctx.lineWidth=9; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.strokeStyle='#f1c40f'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x1-nx*5,y1-ny*5); ctx.lineTo(x2-nx*5,y2-ny*5); ctx.stroke();
    ctx.fillStyle='#333'; ctx.beginPath(); ctx.arc(cx,cy,5,0,7); ctx.fill();
    ctx.fillStyle='#333'; ctx.font='bold 15px Arial'; ctx.textAlign='left';
    ctx.fillText('Feldlinien durch die Spule: '+n, 340, 40);
    ctx.font='12px Arial'; ctx.fillStyle='#666'; ctx.fillText('(gelbe Seite oben = positiv, gelbe Seite unten = negativ)', 340, 58);
    drawMeter(ctx, 640, 120, 46, u/1.4, 'Spannung U');
    const pts = hist.length>1? hist : [{f:phi,u},{f:phi,u}];
    const full = pts.length<260 ? [...Array(260-pts.length).fill(0).map(()=>({f:0,u:0})), ...pts] : pts;
    drawStrip(ctx, 340, 180, 400, 100, full, 'f', '#0b7bc1', 'Feldlinien durch die Spule', 1.1);
    drawStrip(ctx, 340, 290, 400, 100, full, 'u', '#c0392b', 'induzierte Spannung U', 2.2);
  }
  requestAnimationFrame(frame);

/* =====================================================================
   Animationen und Simulationen Klasse 7 (Elektrizitätslehre)
   ===================================================================== */
const C_RED = '#d9433b', C_BLU = '#2b6cd4', C_GRN = '#2f9e5a', C_GOLD = '#f5b301', C_INK = '#1d2433', C_CU = '#c87533';
function T(ctx, s, x, y, o = {}){ ctx.save(); ctx.fillStyle = o.c || '#333'; ctx.font = (o.b ? 'bold ' : '') + (o.s || 14) + 'px Trebuchet MS, Segoe UI, Arial'; ctx.textAlign = o.a || 'center'; ctx.textBaseline = o.bl || 'alphabetic'; ctx.fillText(s, x, y); ctx.restore(); }
function circ(ctx, x, y, r, fill, stroke, lw){ ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); if(fill){ ctx.fillStyle = fill; ctx.fill(); } if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1.5; ctx.stroke(); } }
function line(ctx, pts, col, lw, dash){ ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw || 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; if(dash) ctx.setLineDash(dash); ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.restore(); }
function arrow(ctx, x1, y1, x2, y2, col, lw = 3){
  ctx.save(); ctx.strokeStyle = ctx.fillStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1), s = 6 + lw * 1.5; ctx.beginPath(); ctx.moveTo(x2 + Math.cos(a) * 2, y2 + Math.sin(a) * 2); ctx.lineTo(x2 - s * Math.cos(a - .45), y2 - s * Math.sin(a - .45)); ctx.lineTo(x2 - s * Math.cos(a + .45), y2 - s * Math.sin(a + .45)); ctx.closePath(); ctx.fill(); ctx.restore();
}
function plusMinus(ctx, x, y, sign, r = 7, col){ ctx.save(); ctx.strokeStyle = col || (sign > 0 ? C_RED : C_BLU); ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); if(sign > 0){ ctx.moveTo(x, y - r); ctx.lineTo(x, y + r); } ctx.stroke(); ctx.restore(); }
function electron(ctx, x, y, r = 5){ circ(ctx, x, y, r, C_BLU); ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x - r * .55, y); ctx.lineTo(x + r * .55, y); ctx.stroke(); ctx.restore(); }
function lamp(ctx, x, y, r, b, label){       // Glühlampe, Helligkeit b 0..1
  if(b > .02){ const g = ctx.createRadialGradient(x, y, 3, x, y, r * 3.2); g.addColorStop(0, `rgba(255,225,90,${.85 * b})`); g.addColorStop(1, 'rgba(255,225,90,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3.2, 0, 7); ctx.fill(); }
  circ(ctx, x, y, r, b > .02 ? `rgb(255,${238 - 40 * b},${150 - 110 * b})` : '#f4f6fa', '#555', 2);
  ctx.save(); ctx.strokeStyle = '#555'; ctx.lineWidth = 2; const k = r * .7; ctx.beginPath(); ctx.moveTo(x - k, y - k); ctx.lineTo(x + k, y + k); ctx.moveTo(x + k, y - k); ctx.lineTo(x - k, y + k); ctx.stroke(); ctx.restore();
  if(label) T(ctx, label, x, y + r + 18, {s: 13});
}
function battery(ctx, x, y, w, label, vert){   // Schaltzeichen Batterie (langer Strich = +)
  ctx.save(); ctx.strokeStyle = C_INK; ctx.lineWidth = 3;
  if(!vert){ ctx.beginPath(); ctx.moveTo(x - 6, y - 18); ctx.lineTo(x - 6, y + 18); ctx.stroke(); ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x + 6, y - 9); ctx.lineTo(x + 6, y + 9); ctx.stroke();
    T(ctx, '+', x - 16, y - 20, {b: true, s: 16, c: C_RED}); T(ctx, '−', x + 18, y - 14, {b: true, s: 18, c: C_BLU}); }
  ctx.restore(); if(label) T(ctx, label, x, y + 36, {s: 13, b: true});
}
function sw(ctx, x1, y, x2, closed, hot){      // Schalter (Schaltzeichen), horizontal
  ctx.save(); ctx.strokeStyle = hot ? '#e8762b' : C_INK; ctx.lineWidth = 3;
  circ(ctx, x1, y, 4, '#fff', C_INK, 2); circ(ctx, x2, y, 4, '#fff', C_INK, 2);
  ctx.beginPath(); ctx.moveTo(x1 + 3, y); ctx.lineTo(closed ? x2 - 3 : x2 - 6, closed ? y : y - (x2 - x1) * .45); ctx.stroke(); ctx.restore();
}
function tapZones(cv, W, H, zones){             // klickbare Bereiche im Canvas
  cv.style.cursor = 'pointer';
  cv.addEventListener('click', e => {
    const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
    const z = zones().find(z => x >= z[0] && x <= z[2] && y >= z[1] && y <= z[3]); if(z) z[4]();
  });
}
/* gemeinsames Gerüst: Titel, Text, Canvas, Steuerung. Läuft nur, wenn die Simulation sichtbar ist. */
function simBox(root, title, intro, W, H){
  root.className = 'sim';
  root.innerHTML = `<div class="simtitle">🎬 ${title}</div>${intro ? `<div class="small">${intro}</div>` : ''}<canvas></canvas><div class="simctl"></div>`;
  const cv = $('canvas', root); const ctx = setupCanvas(cv, W, H); cv.style.touchAction = 'manipulation';   // Seite bleibt auf dem iPad scrollbar
  let vis = true;
  if('IntersectionObserver' in window){ vis = false; new IntersectionObserver(es => es.forEach(e => vis = e.isIntersecting), {rootMargin: '80px'}).observe(cv); }
  const S = {root, cv, ctx, W, H, ctl: $('.simctl', root),
    run(fn){ let tp = performance.now(), first = true; const f = t => { if(!root.isConnected) return; const dt = Math.max(0, Math.min(.05, (t - tp) / 1000)); tp = t; if((vis && root.offsetParent !== null) || first){ first = false; fn(dt, t / 1000); } requestAnimationFrame(f); }; requestAnimationFrame(f); },
    btn(label, fn, cls){ const b = h('button', {class: 'sbtn ' + (cls || '')}); b.innerHTML = label; b.onclick = () => fn(b); S.row().appendChild(b); return b; },
    group(label, opts, val, fn){ const r = S.row(true); if(label) r.appendChild(h('span', {class: 'glabel'}, label));
      const bs = opts.map(([v, t]) => { const b = h('button', {class: 'sbtn seg' + (v === val ? ' on' : '')}); b.innerHTML = t; b.onclick = () => { bs.forEach(x => x.classList.remove('on')); b.classList.add('on'); fn(v); }; r.appendChild(b); return b; }); return bs; },
    slider(label, min, max, step, val, show){ const r = h('div', {class: 'slider'}); r.innerHTML = `<label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}" value="${val}"><output></output>`;
      S.ctl.appendChild(r); const i = $('input', r), o = $('output', r); const up = () => o.textContent = show ? show(+i.value) : i.value; i.addEventListener('input', up); up(); return i; },
    _row: null, row(fresh){ if(fresh || !S._row){ S._row = h('div', {class: 'simbtns'}); S.ctl.appendChild(S._row); } return S._row; }
  };
  return S;
}

/* ===================== Kapitel 1: Atome und Ladung ===================== */

function simRiver(root){

  const S = simBox(root, 'Der Elektromagnet', 'Schalte den Strom ein. Verändere die Stromstärke und die Zahl der Windungen. Mit oder ohne Eisenkern? <span class="en">(electromagnet)</span>', 760, 330);
  const {ctx, W, H} = S; let on = false, core = true, held = 0, needle = 0;
  S.btn('⚡ Strom an/aus', b => { on = !on; b.classList.toggle('on', on); }, 'prim');
  S.group('Eisenkern:', [[true, 'mit'], [false, 'ohne']], true, v => core = v);
  const iS = S.slider('Stromstärke', 1, 5, 1, 2, v => v + ' A'); const nS = S.slider('Windungen', 10, 50, 10, 20, v => v);
  S.run((dt, t) => {
    const B = on ? (+iS.value) * (+nS.value) / 50 * (core ? 4 : .6) : 0;      // Stärke
    const want = Math.min(12, Math.floor(B * 1.5)); held += (want - held) * Math.min(1, dt * 3);
    needle += ((on ? Math.min(1.3, B * .6) : 0) - needle) * Math.min(1, dt * 3);
    ctx.clearRect(0, 0, W, H);
    const x0 = 180, y0 = 110, wdt = 260;
    if(core){ ctx.fillStyle = '#8a8f99'; ctx.fillRect(x0 - 20, y0 + 10, wdt + 40, 40); }
    const n = +nS.value; for(let i = 0; i < n; i++){ const x = x0 + i * wdt / n; ctx.strokeStyle = on ? '#e8762b' : C_CU; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(x + 3, y0 + 30, 6, 32, 0, 0, 7); ctx.stroke(); }
    // Büroklammern unten
    for(let i = 0; i < 12; i++){ const hold = i < held - .5, x = x0 + 20 + (i % 6) * 40, y = hold ? y0 + 75 + Math.floor(i / 6) * 22 : 290; ctx.strokeStyle = '#7d8590'; ctx.lineWidth = 2.5; roundRect(ctx, x, y - 8, 30, 14, 7); ctx.stroke(); }
    T(ctx, 'Büroklammern: ' + Math.round(held) + ' werden angezogen', x0 + wdt / 2, 270, {s: 14, b: true, c: '#333'});
    // Kompass rechts
    const cx = 600, cy = 80; circ(ctx, cx, cy, 44, '#fff', '#555', 2); ctx.save(); ctx.translate(cx, cy); ctx.rotate(-Math.PI / 2 + needle); ctx.fillStyle = C_RED; ctx.beginPath(); ctx.moveTo(0, -36); ctx.lineTo(7, 0); ctx.lineTo(-7, 0); ctx.fill(); ctx.fillStyle = '#ccc'; ctx.beginPath(); ctx.moveTo(0, 36); ctx.lineTo(7, 0); ctx.lineTo(-7, 0); ctx.fill(); ctx.restore();
    T(ctx, 'Magnetnadel', cx, cy + 64, {s: 13});
    T(ctx, on ? (core ? 'Mit Eisenkern ist der Magnet viel stärker!' : 'Ohne Eisenkern: nur schwach magnetisch.') : 'Kein Strom → kein Magnet.', 380, 30, {s: 15, b: true, c: on ? '#1f7a3a' : '#555'});
  });
}
function simChem(root){

  const {ctx, W, H} = S; let on = false, b = [], g1 = 0, g2 = 0;

  S.run(dt => {
    if(on){ if(Math.random() < dt * 22) b.push({x: 270 + (Math.random() - .5) * 14, y: 270, s: 1}); if(Math.random() < dt * 11) b.push({x: 490 + (Math.random() - .5) * 14, y: 270, s: 2}); }
    b.forEach(p => p.y -= 60 * dt); b = b.filter(p => { if(p.y < 130){ if(p.s === 1) g1 += .6; else g2 += .6; return false; } return true; });
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#d6ecfa'; ctx.fillRect(180, 120, 400, 170); ctx.strokeStyle = '#7aa7c7'; ctx.lineWidth = 3; ctx.strokeRect(180, 70, 400, 220);
    // Röhrchen mit Gas
    [[270, g1, 'Wasserstoff', 'Minuspol'], [490, g2, 'Sauerstoff', 'Pluspol']].forEach(([x, g, n, pol]) => { ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.strokeRect(x - 20, 40, 40, 200); ctx.fillStyle = '#fff'; ctx.fillRect(x - 18, 42, 36, Math.min(196, g)); ctx.fillStyle = '#d6ecfa'; ctx.fillRect(x - 18, 42 + Math.min(196, g), 36, 196 - Math.min(196, g));
      line(ctx, [[x, 240], [x, 280]], '#555', 4); T(ctx, n, x, 30, {s: 13, b: true}); T(ctx, pol, x, 305, {s: 13, b: true, c: pol === 'Minuspol' ? C_BLU : C_RED}); });
    b.forEach(p => circ(ctx, p.x, p.y, 3.5, '#fff', '#7aa7c7', 1));
    T(ctx, on ? 'Gasblasen!' : 'Strom aus.', 596, 140, {s: 15, b: true, a: 'left', c: '#16325c'}); if(on){ T(ctx, 'Am Minuspol entsteht', 596, 162, {s: 13, a: 'left'}); T(ctx, 'doppelt so viel Gas.', 596, 180, {s: 13, a: 'left'}); }
    T(ctx, 'Wasser wird in', 596, 214, {s: 13, a: 'left'}); T(ctx, 'Wasserstoff und', 596, 232, {s: 13, a: 'left'}); T(ctx, 'Sauerstoff zerlegt.', 596, 250, {s: 13, a: 'left'});
  });
}
function bar(ctx, x, y, w, hgt, v, col, label){
  ctx.save(); ctx.fillStyle = '#e9edf3'; roundRect(ctx, x, y, w, hgt, 5); ctx.fill();
  ctx.fillStyle = col; const ww = Math.max(0, Math.min(1, v)) * w; if(ww > 1){ roundRect(ctx, x, y, ww, hgt, 5); ctx.fill(); }
  ctx.restore(); if(label) T(ctx, label, x, y - 5, {a:'left', s:12, c:'#444'});
}
